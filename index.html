<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tabTitle">RZSTREAM - Streaming Donghua Sub Indo</title>

  <!-- Panggil Konfigurasi Firebase Eksternal -->
  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    /* ==================== VARIABEL WARNA HITAM PEKAT ==================== */
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-skeleton: #121212;
      --bg-header-scrolled: rgba(10, 10, 10, 0.92);
      --bg-search-input: #121212;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-star: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-bottom: 40px; 
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    /* ==================== ANIMASI SKELETON LOADING ==================== */
    @keyframes skeletonPulse {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 0.4; }
    }

    .skeleton {
      background-color: var(--bg-skeleton);
      animation: skeletonPulse 1.5s infinite ease-in-out;
      border-radius: 8px;
    }

    .skeleton-hero {
      width: 100%; height: 500px;
      position: relative; overflow: hidden;
      display: flex; align-items: flex-end; padding: 20px 20px 45px 20px;
    }

    .skeleton-text { height: 14px; margin-bottom: 8px; border-radius: 4px; }
    .skeleton-text.title { height: 24px; width: 70%; margin-bottom: 12px; }
    .skeleton-text.sub { height: 12px; width: 40%; margin-bottom: 16px; }
    .skeleton-btn { height: 38px; width: 110px; border-radius: 10px; }

    .card-skeleton { width: 100%; }
    .card-skeleton-img { width: 100%; height: 160px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border-color); }
    .card-skeleton-title { height: 13px; width: 85%; margin-bottom: 4px; }
    .card-skeleton-sub { height: 11px; width: 50%; }

    /* ==================== HEADER ==================== */
    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      padding: 10px 12px; pointer-events: none;
      transition: padding 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    .header-content { 
      max-width: 100%; width: 100%; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
      position: relative; height: 52px; padding: 0 8px; border-radius: 26px;
      pointer-events: auto; background: transparent; border: 1px solid transparent;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    header.scrolled { padding: 10px 20px; }
    header.scrolled .header-content {
      max-width: 880px; padding: 0 16px;
      background: var(--bg-header-scrolled); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    }
    
    .header-normal-group { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .header-left-group { display: flex; align-items: center; gap: 12px; }
    .header-right-group { display: flex; align-items: center; gap: 8px; }

    .icon-circle-btn { 
      background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); color: var(--text-main); 
      border-radius: 50%; width: 38px; height: 38px; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; 
      border: 1px solid var(--border-color); text-decoration: none;
    }

    .icon-circle-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .brand-title { font-size: 22px; font-weight: 900; color: var(--color-accent); letter-spacing: 0.5px; text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); text-decoration: none; }

    .menu-dropdown {
      display: none; position: absolute; top: 60px; right: 16px;
      background: #0d0d0d; backdrop-filter: blur(16px); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 8px; min-width: 190px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 101;
    }
    .menu-dropdown.active { display: block; }
    .menu-dropdown a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-main); text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .menu-dropdown a:hover { background: rgba(56, 189, 248, 0.15); color: var(--color-accent); }

    /* ==================== MODAL OVERLAY GENERAL ==================== */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-main); z-index: 999; padding: 16px; overflow-y: auto; }
    .modal-overlay.active { display: block; }

    .search-modal-header { display: flex; align-items: center; gap: 12px; max-width: 800px; margin: 0 auto 16px auto; }
    .search-input-box { flex: 1; position: relative; display: flex; align-items: center; }
    .search-input-box svg { position: absolute; left: 14px; width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .search-input-field { width: 100%; height: 46px; background: var(--bg-search-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 0 16px 0 42px; color: var(--text-main); font-size: 15px; outline: none; }
    
    .modal-close-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
    .modal-close-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.2; }

    .search-info-bar { max-width: 800px; margin: 0 auto 16px auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .search-badge-source { background: rgba(14, 165, 233, 0.2); color: var(--color-accent); border: 1px solid var(--border-color); padding: 3px 10px; border-radius: 12px; font-weight: 700; font-size: 12px; }

    .search-results-list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .search-item-card { display: flex; gap: 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .search-item-card:hover { transform: translateY(-2px); border-color: var(--color-accent); }
    .search-item-thumb { width: 75px; height: 100px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--bg-card); }
    .search-item-info { display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .search-item-title { font-size: 15px; font-weight: 700; color: var(--text-main); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .search-item-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
    .search-item-ep { font-size: 12px; font-weight: 700; color: var(--color-accent); margin-top: 6px; }

    .dialog-header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px auto; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .dialog-title { font-size: 20px; font-weight: 800; color: var(--color-accent); }

    .load-more-btn { display: block; width: 100%; max-width: 800px; margin: 24px auto 0 auto; padding: 14px; background: var(--bg-card); color: var(--color-accent); border: 1px solid var(--border-color); border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; text-align: center; }

    /* ==================== HERO SLIDER ==================== */
    .hero-slider-wrapper { position: relative; width: 100%; height: 500px; overflow: hidden; background: #000; }
    .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease-in-out; display: flex; align-items: flex-end; }
    .hero-slide.active { opacity: 1; z-index: 1; }
    .hero-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--bg-main) 15%, rgba(0, 0, 0, 0.6) 55%, rgba(0, 0, 0, 0.2) 100%); }
    
    .hero-content { position: relative; z-index: 2; padding: 20px 20px 45px 20px; max-width: 600px; }
    .badge-tag { display: inline-block; background: var(--color-primary); color: var(--text-main); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; }
    .hero-title { font-size: 24px; font-weight: 900; line-height: 1.2; color: var(--text-main); margin-bottom: 8px; text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; }
    .rating-star { color: var(--color-star); font-weight: 800; display: flex; align-items: center; gap: 4px; }
    .badge-status-green { background: rgba(56, 189, 248, 0.15); color: var(--color-accent); border: 1px solid var(--border-color); font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    
    .btn-watch { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%); color: var(--text-main); border: none; padding: 10px 24px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-watch svg { width: 16px; height: 16px; fill: currentColor; }

    .slider-dots { position: absolute; bottom: 16px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; cursor: pointer; transition: all 0.3s; }
    .dot.active { width: 28px; background: var(--color-accent); border-radius: 10px; }

    /* ==================== KONTEN GRID ==================== */
    .section-block { margin-top: 24px; }
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--text-main); }

    .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    
    .card-continue { flex: 0 0 calc((100% - 24px) / 3); min-width: calc((100% - 24px) / 3); cursor: pointer; }
    .card-continue-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-color); }
    .card-continue img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { position: absolute; top: 8px; left: 8px; background: var(--color-primary); color: var(--text-main); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; z-index: 2; }
    
    .badge-view-count { 
      position: absolute; bottom: 8px; right: 8px; 
      background: rgba(0, 0, 0, 0.82); color: #e2e8f0; 
      border: 1px solid var(--border-color); 
      font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px; 
      backdrop-filter: blur(4px); display: flex; align-items: center; gap: 3px; z-index: 2;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-color); }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-bottom { position: absolute; bottom: 8px; left: 8px; max-width: calc(60%); background: rgba(0, 0, 0, 0.85); color: var(--color-accent); border: 1px solid var(--border-color); font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
    
    .card-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .see-all-btn { color: var(--color-accent); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; background: none; }

    footer { margin-top: 50px; padding: 24px 16px; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 13px; }
    footer a { color: var(--color-accent); text-decoration: none; }
  </style>
</head>
<body>

  <header id="mainHeader">

        <div class="header-left-group">

  <!-- Modal Pencarian Overlay -->
  <div class="modal-overlay" id="searchModalOverlay">
    <div class="search-modal-header">
      <div class="search-input-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

  <!-- POP-UP DIALOG MODAL DONGHUA TERBARU -->
  <div class="modal-overlay" id="latestModalOverlay">
    <div class="dialog-header">
      <h2 class="dialog-title">🔥 Semua Donghua Terbaru</h2>
      <button class="modal-close-btn" onclick="closeLatestDialog()">

      </button>

    <div class="container" style="padding: 0;">
      <div class="grid-3" id="latestModalGrid"></div>
      <button class="load-more-btn" id="loadMoreDialogBtn" onclick="loadMoreDialogData()">Muat Lainnya</button>

  <!-- Banner Hero Slider (Placeholder Skeleton Awal) -->
  <div class="hero-slider-wrapper" id="heroSlider">
    <div class="skeleton skeleton-hero">
      <div style="width: 100%;">
        <div class="skeleton skeleton-text title"></div>
        <div class="skeleton skeleton-text sub"></div>
        <div class="skeleton skeleton-btn"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 1. Lanjutkan Menonton -->
    <section class="section-block" id="continueSection" style="display: none;">
      <h2 class="section-title">Lanjutkan Menonton</h2>

    <section class="section-block">
      <div class="section-header-flex">

        <button class="see-all-btn" onclick="openLatestDialog()">Lihat Semua</button>
      </div>
      <div class="grid-3" id="latestGrid" style="margin-top: 14px;">
        <!-- Grid 3 Skeleton Placeholder -->
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>

  <footer>

  <script>
    let searchTimer = null;
    let currentSlide = 0;
    let slideInterval = null;
    let dialogPage = 1;
    let allMasterDonghuaList = [];

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatViews(num) {
      if (!num || isNaN(num)) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return num;
    }

    async function trackDonghuaClick(item) {
      const slug = cleanPath(item.slug);
      const today = getTodayString();

      saveToContinueHistory(item);

      if (!window.db) {
        window.location.href = `/detail/${slug}`;
        return;
      }

      try {
        const totalRef = window.fbRef(window.db, `views_total/${slug}`);
        window.fbTransaction(totalRef, (current) => (current || 0) + 1);

        const dailyRef = window.fbRef(window.db, `views_daily/${today}/${slug}`);
        await window.fbTransaction(dailyRef, (current) => (current || 0) + 1);
      } catch (e) {
        console.error("Gagal update view:", e);
      }

      window.location.href = `/detail/${slug}`;
    }

    async function handleAuthAction() {
      toggleMenu();
      if (window.currentUser) {
        if (confirm("Apakah Anda ingin keluar dari akun Google?")) {
          await window.fbSignOut(window.auth);
        }
      } else {
        try {
          await window.fbSignIn(window.auth, window.googleProvider);
        } catch (e) {
          alert("Gagal Login: " + e.message);
        }
      }
    }

    async function applyDashboardSettings() {
      try {
        const res = await fetch('/api/settings').then(r => r.json());
        if (res.success && res.settings) {
          const brand = res.settings.brandTitle || 'RZSTREAM';
          const pageTitle = res.settings.pageTitle || 'RZSTREAM - Streaming Donghua Sub Indo';
          document.getElementById('displayBrandTitle').innerText = brand;
          document.getElementById('searchBrandBadge').innerText = brand;
          document.getElementById('footerBrand').innerText = brand;
          document.title = pageTitle;
        }
      } catch (e) {}
    }

    window.addEventListener('scroll', () => {
      const header = document.getElementById('mainHeader');
      if (window.scrollY > 15) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    });

    function cleanPath(input) {
      if (!input) return '';
      return String(input).replace(/^https?:\/\/[^\/]+/, '').replace(/^\/detail\//, '').replace(/^\/anime\//, '').replace(/^\/+|\/+$/g, '');
    }

    function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('active'); }
    function openSearchModal() { document.getElementById('searchModalOverlay').classList.add('active'); document.getElementById('searchInputModal').focus(); }
    function closeSearchModal() { document.getElementById('searchModalOverlay').classList.remove('active'); }

    function openLatestDialog() {
      document.getElementById('menuDropdown').classList.remove('active');
      document.getElementById('latestModalOverlay').classList.add('active');
      if (dialogPage === 1) loadMoreDialogData();
    }

    function closeLatestDialog() { document.getElementById('latestModalOverlay').classList.remove('active'); }

    async function loadMoreDialogData() {
      const btn = document.getElementById('loadMoreDialogBtn');
      btn.innerText = 'Memuat...';

      try {
        const res = await fetch(`/api/donghua?type=latest&page=${dialogPage}`).then(r => r.json());
        if (res.success && res.data && res.data.length > 0) {
          const grid = document.getElementById('latestModalGrid');
          res.data.forEach(item => grid.appendChild(createGridCard(item)));
          dialogPage++;
          btn.innerText = 'Muat Lainnya';
        } else {
          btn.innerText = 'Tidak ada data lagi';
        }
      } catch (e) {
        btn.innerText = 'Gagal memuat data';
      }
    }

    function handleSearchInput(event) {
      const query = event.target.value.trim();
      const resultsList = document.getElementById('searchResultsList');

      clearTimeout(searchTimer);
      if (query === '') {
        resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul donghua yang ingin dicari...</p>';
        return;
      }

      resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Mencari donghua...</p>';

      searchTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`).then(r => r.json());
          resultsList.innerHTML = '';
          if (res.success && res.data && res.data.length > 0) {
            res.data.forEach(item => {
              const card = document.createElement('div');
              card.className = 'search-item-card';
              card.onclick = () => trackDonghuaClick(item);
              card.innerHTML = `
                <img class="search-item-thumb" src="${item.poster}" alt="${item.title}" loading="lazy" />
                <div class="search-item-info">
                  <div>
                    <div class="search-item-title">${item.title}</div>
                    <div class="search-item-desc">${item.synopsis || 'Saksikan keseruan petualangan donghua sub indo berkualitas HD secara gratis.'}</div>
                  </div>
                  <div class="search-item-ep">${item.episode || 'Episode Terbaru'}</div>
                </div>
              `;
              resultsList.appendChild(card);
            });
          } else {
            resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Donghua tidak ditemukan.</p>';
          }
        } catch (e) {
          resultsList.innerHTML = '<p style="color: #ef4444; font-size: 13px; text-align: center; margin-top: 40px;">Gagal memuat hasil pencarian.</p>';
        }
      }, 400);
    }

    function renderHeroSlider(items) {
      const slider = document.getElementById('heroSlider');
      if (!slider) return;
      slider.innerHTML = '';

      const sliderItems = items.slice(0, 5);
      sliderItems.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
        
        slide.innerHTML = `
          <img class="hero-bg-img" src="${item.poster}" alt="${item.title}" />
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="badge-tag">DONGHUA</span>
            <h1 class="hero-title">${item.title}</h1>
            <div class="hero-meta">
              <span class="rating-star">★ 9.0</span>
              <span>•</span>
              <span class="badge-status-green">${item.status || 'ONGOING'}</span>
              <span>•</span>
              <span>${item.episode || 'Ep 1'}</span>
            </div>
            <button class="btn-watch" onclick="trackDonghuaClick(${JSON.stringify(item).replace(/"/g, '&quot;')})">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Tonton
            </button>
          </div>
        `;
        slider.appendChild(slide);
      });

      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'slider-dots';
      dotsContainer.id = 'sliderDots';

      sliderItems.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => setSlide(index);
        dotsContainer.appendChild(dot);
      });

      slider.appendChild(dotsContainer);
      startSliderAutoPlay(sliderItems.length);
    }

    function setSlide(index) {
      const slides = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.dot');
      if (slides.length === 0) return;

      slides[currentSlide].classList.remove('active');
      if (dots[currentSlide]) dots[currentSlide].classList.remove('active');

      currentSlide = index;

      slides[currentSlide].classList.add('active');
      if (dots[currentSlide]) dots[currentSlide].classList.add('active');
    }

    function startSliderAutoPlay(total) {
      clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        let next = (currentSlide + 1) % total;
        setSlide(next);
      }, 4000);
    }

    function createGridCard(item) {
      const card = document.createElement('div');
      card.className = 'card-grid';
      card.onclick = () => trackDonghuaClick(item);

      const viewBadge = item.views !== undefined 
        ? `<span class="badge-view-count">👁️ ${formatViews(item.views)}</span>` 
        : '';

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <span class="badge-ep">${item.status || 'Ongoing'}</span>
          <span class="badge-bottom">${item.episode || 'Ep 1'}</span>
          ${viewBadge}
        </div>
        <div class="card-title">${item.title}</div>
      `;
      return card;
    }

    function createScrollCard(item) {
      const card = document.createElement('div');
      card.className = 'card-continue';
      card.onclick = () => trackDonghuaClick(item);

      const viewBadge = item.views !== undefined 
        ? `<span class="badge-view-count">👁️ ${formatViews(item.views)}</span>` 
        : '';

      card.innerHTML = `
        <div class="card-continue-img-wrapper">
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <span class="badge-ep">${item.status || 'Ongoing'}</span>
          <span class="badge-bottom">${item.episode || 'Ep 1'}</span>
          ${viewBadge}
        </div>
        <div class="card-title">${item.title}</div>
      `;
      return card;
    }

    function renderGridItems(list, targetElement) {
      if (!targetElement) return;
      targetElement.innerHTML = '';
      if (Array.isArray(list) && list.length > 0) {
        list.forEach(item => {
          if (item && item.title) targetElement.appendChild(createGridCard(item));
        });
      } else {
        targetElement.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; grid-column: span 3;">Data tidak tersedia.</p>';
      }
    }

    async function loadFirebasePopularData() {
      if (!window.db) return;

      const today = getTodayString();

      try {
        const totalSnap = await window.fbGet(window.fbRef(window.db, 'views_total'));
        const dailySnap = await window.fbGet(window.fbRef(window.db, `views_daily/${today}`));

        const totalViewsMap = totalSnap.exists() ? totalSnap.val() : {};
        const dailyViewsMap = dailySnap.exists() ? dailySnap.val() : {};

        let totalPopularList = [...allMasterDonghuaList].map(item => {
          const s = cleanPath(item.slug);
          return { ...item, views: totalViewsMap[s] || 0 };
        }).sort((a, b) => b.views - a.views).slice(0, 12);

        const popAllGrid = document.getElementById('popularAllGrid');
        if (popAllGrid) renderGridItems(totalPopularList, popAllGrid);

        let dailyPopularList = [...allMasterDonghuaList].map(item => {
          const s = cleanPath(item.slug);
          return { ...item, views: dailyViewsMap[s] || 0 };
        }).sort((a, b) => b.views - a.views).slice(0, 12);

        const popRow = document.getElementById('popularTodayRow');
        if (popRow) {
          popRow.innerHTML = '';
          if (dailyPopularList.length > 0) {
            dailyPopularList.forEach(item => popRow.appendChild(createScrollCard(item)));
          } else {
            popRow.innerText = 'Data tidak tersedia.';
          }
        }
      } catch (e) {
        console.error("Gagal memuat populer dari Firebase:", e);
      }
    }

    async function loadMainContent() {
      const latestGrid = document.getElementById('latestGrid');

      try {
        const res = await fetch('/api/donghua?type=all').then(r => r.json());
        if (res && res.success && res.data) {
          const masterMap = new Map();
          [...(res.data.latest || []), ...(res.data.popularToday || []), ...(res.data.popularAll || [])].forEach(i => {
            if (i && i.slug) masterMap.set(cleanPath(i.slug), i);
          });
          allMasterDonghuaList = Array.from(masterMap.values());

          if (res.data.popularToday && res.data.popularToday.length > 0) {
            renderHeroSlider(res.data.popularToday);
          }

          if (latestGrid) renderGridItems(res.data.latest || [], latestGrid);

          loadFirebasePopularData();
        }
      } catch (e) {
        console.error('Gagal memuat beranda:', e);
      }
    }

    async function saveToContinueHistory(item) {
      const cleanSlug = cleanPath(item.slug);
      const historyItem = {
        title: item.title,
        poster: item.poster,
        mainPath: cleanSlug,
        episode: item.episode || 'Lanjut'
      };

      if (window.currentUser && window.db) {
        const userHistRef = window.fbRef(window.db, `users/${window.currentUser.uid}/history/${cleanSlug}`);
        await window.fbSet(userHistRef, historyItem);
      } else {
        let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
        history = history.filter(i => cleanPath(i.mainPath) !== cleanSlug);
        history.unshift(historyItem);
        localStorage.setItem('rz_continue_history', JSON.stringify(history.slice(0, 10)));
      }
    }

    window.renderContinueWatching = async function() {
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');
      let historyList = [];

      if (window.currentUser && window.db) {
        try {
          const snap = await window.fbGet(window.fbRef(window.db, `users/${window.currentUser.uid}/history`));
          if (snap.exists()) {
            historyList = Object.values(snap.val());
          }
        } catch (e) {}
      } else {
        historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      }

      if (!historyList || historyList.length === 0) { 
        container.style.display = 'none'; 
        return; 
      }

      container.style.display = 'block';
      row.innerHTML = '';

      historyList.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card-continue';
        card.onclick = () => window.location.href = `/detail/${cleanPath(item.mainPath)}`;
        card.innerHTML = `
          <div class="card-continue-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-ep">${item.episode || 'Lanjut'}</span>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        row.appendChild(card);
      });
    };

    window.onload = () => {
      applyDashboardSettings();
      loadMainContent();
    };
  </script>
</body>
</html>
