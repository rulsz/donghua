<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Donghua Anichin</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; text-align: center; }
    h1 { color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: scale(1.03); }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #334155; }
    .card-title { padding: 8px; font-size: 12px; font-weight: bold; height: 45px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #statusMsg { margin-top: 20px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Katalog Donghua Anichin</h1>
    <div id="statusMsg">Memuat data langsung dari Anichin...</div>
    <div class="grid" id="donghuaGrid"></div>
  </div>

  <script>
    // Memakai Proxy AllOrigins untuk mem-bypass CORS
    const TARGET_URL = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://anichin.moe');

    window.onload = loadData;

    async function loadData() {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('donghuaGrid');

      try {
        const response = await fetch(TARGET_URL);
        const result = await response.json();
        
        if (!result.contents) throw new Error('Data tidak terambil dari proxy');

        // Parse string HTML menjadi elemen DOM Virtual
        const parser = new DOMParser();
        const doc = parser.parseFromString(result.contents, 'text/html');
        
        const cards = doc.querySelectorAll('article, div.bs, div.bsx, div.post-show');
        const donghuaList = [];

        cards.forEach(card => {
          const titleEl = card.querySelector('div.tt, h2, h3, .title');
          const linkEl = card.querySelector('a');
          const imgEl = card.querySelector('img');

          if (titleEl && linkEl) {
            // PERBAIKAN: Menggunakan textContent, bukan innerText
            const title = titleEl.textContent ? titleEl.textContent.trim() : '';
            const href = linkEl.getAttribute('href');
            let poster = imgEl ? (imgEl.getAttribute('data-src') || imgEl.getAttribute('src') || imgEl.getAttribute('data-lazy-src')) : '';

            if (href && title) {
              donghuaList.push({
                title: title.replace(/\s+/g, ' '),
                href: href,
                poster: poster || 'https://via.placeholder.com/150'
              });
            }
          }
        });

        // Hapus duplikat berdasarkan URL
        const uniqueList = donghuaList.filter((v, i, a) => a.findIndex(t => t.href === v.href) === i);

        if (uniqueList.length > 0) {
          status.style.display = 'none';
          grid.innerHTML = '';
          uniqueList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => window.open(item.href, '_blank');
            card.innerHTML = `
              <img src="${item.poster}" alt="${item.title}" loading="lazy" />
              <div class="card-title">${item.title}</div>
            `;
            grid.appendChild(card);
          });
        } else {
          status.innerText = 'Struktur halaman Anichin tidak sesuai atau terblokir.';
        }

      } catch (err) {
        status.innerText = 'Gagal memuat data dari Proxy: ' + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
