<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Donghua</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-bottom: 40px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }

    /* Top Navigation Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; margin-bottom: 10px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .profile-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #1e293b; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .icon-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }

    /* Section Styling */
    .section-title { font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .section-subtitle { font-size: 13px; color: #64748b; margin-bottom: 15px; }
    .section-block { margin-top: 25px; }

    /* Horizontal Scroll Layout (Lanjutkan Menonton) */
    .scroll-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    
    .card-continue { min-width: 130px; max-width: 130px; flex-shrink: 0; cursor: pointer; position: relative; }
    .card-continue-img-wrapper { position: relative; width: 100%; height: 180px; border-radius: 16px; overflow: hidden; background: #1e293b; }
    .card-continue img { width: 100%; height: 100%; object-fit: cover; }
    .badge-ep { position: absolute; top: 10px; left: 10px; background: #38bdf8; color: #0f172a; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 6px; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

    /* Grid Layout (Rilisan Terbaru) */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 14px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 170px; border-radius: 16px; overflow: hidden; background: #1e293b; }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    .badge-bottom { position: absolute; bottom: 10px; left: 10px; background: rgba(255, 255, 255, 0.9); color: #0f172a; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 12px; }

    /* Title Styling */
    .card-title { margin-top: 8px; font-size: 13px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }

    /* Status & Pagination */
    #statusMsg { text-align: center; margin: 30px 0; font-size: 13px; color: #64748b; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 35px; }
    .btn { background-color: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn:hover { background-color: #334155; }
    .page-info { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Top Header Navigation -->
    <header>
      <div class="header-left">
        <img src="https://via.placeholder.com/100" alt="Profile" class="profile-avatar">
      </div>
      <div class="header-right">
        <button class="icon-btn">☰</button>
        <button class="icon-btn">🔍</button>
      </div>
    </header>

    <!-- Section 1: Lanjutkan Menonton -->
    <section class="section-block" id="continueSection" style="display: none;">
      <h2 class="section-title">Lanjutkan Menonton</h2>
      <div class="scroll-row" id="continueRow"></div>
    </section>

    <!-- Section 2: Rilisan Terbaru (Menggantikan For You) -->
    <section class="section-block">
      <h2 class="section-title">Rilisan Terbaru</h2>
      <p class="section-subtitle">Update Donghua Terbaru</p>
      
      <div id="statusMsg">Memuat data...</div>
      <div class="grid" id="donghuaGrid"></div>

      <!-- Pagination Navigation -->
      <div class="pagination" id="paginationNav" style="display: none;">
        <button class="btn" id="prevBtn" onclick="changePage(-1)">← Sebelumnya</button>
        <span class="page-info">Halaman <strong id="pageDisplay" style="color: #38bdf8;">1</strong></span>
        <button class="btn" id="nextBtn" onclick="changePage(1)">Selanjutnya →</button>
      </div>
    </section>

  </div>

  <script>
    let currentPage = 1;

    function getPageFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const page = parseInt(urlParams.get('page'));
      return page && page > 0 ? page : 1;
    }

    function updateURL(page) {
      const newUrl = page > 1 ? `?page=${page}` : window.location.pathname;
      window.history.pushState({ page: page }, '', newUrl);
    }

    window.onload = () => {
      renderContinueWatching();
      currentPage = getPageFromURL();
      loadData(currentPage);
    };

    window.onpopstate = () => {
      currentPage = getPageFromURL();
      loadData(currentPage);
    };

    // Render Data Lanjutkan Menonton dari LocalStorage
    function renderContinueWatching() {
      const history = JSON.parse(localStorage.getItem('continueHistory') || '[]');
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');

      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';
      row.innerHTML = '';

      history.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-continue';
        card.innerHTML = `
          <div class="card-continue-img-wrapper" onclick="openDonghua('${item.href}', '${item.title}', '${item.poster}')">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-ep">Ep Latest</span>
            <button class="close-btn" onclick="event.stopPropagation(); removeHistory(${index})">✕</button>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        row.appendChild(card);
      });
    }

    function removeHistory(index) {
      let history = JSON.parse(localStorage.getItem('continueHistory') || '[]');
      history.splice(index, 1);
      localStorage.setItem('continueHistory', JSON.stringify(history));
      renderContinueWatching();
    }

    function openDonghua(href, title, poster) {
      // Simpan ke riwayat Lanjutkan Menonton
      let history = JSON.parse(localStorage.getItem('continueHistory') || '[]');
      history = history.filter(item => item.href !== href);
      history.unshift({ href, title, poster });
      localStorage.setItem('continueHistory', JSON.stringify(history.slice(0, 10)));

      window.open(href, '_blank');
      renderContinueWatching();
    }

    async function loadData(page) {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('donghuaGrid');
      const paginationNav = document.getElementById('paginationNav');
      const prevBtn = document.getElementById('prevBtn');
      const pageDisplay = document.getElementById('pageDisplay');

      window.scrollTo({ top: 0, behavior: 'smooth' });

      status.style.display = 'block';
      status.innerText = `Memuat halaman ${page}...`;
      grid.innerHTML = '';
      paginationNav.style.display = 'none';

      try {
        const response = await fetch(`/api/donghua?page=${page}`);
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          status.style.display = 'none';
          pageDisplay.innerText = page;

          prevBtn.style.display = page <= 1 ? 'none' : 'inline-block';

          result.data.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'card-grid';
            card.onclick = () => openDonghua(item.href, item.title, item.poster);
            card.innerHTML = `
              <div class="card-grid-img-wrapper">
                <img src="${item.poster}" alt="${item.title}" loading="lazy" />
                <span class="badge-bottom">${i + 1} EP</span>
              </div>
              <div class="card-title">${item.title}</div>
            `;
            grid.appendChild(card);
          });

          paginationNav.style.display = 'flex';
        } else {
          status.innerText = 'Data tidak ditemukan.';
        }
      } catch (err) {
        status.innerText = 'Gagal terhubung ke API Server.';
        console.error(err);
      }
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      updateURL(currentPage);
      loadData(currentPage);
    }
  </script>
</body>
</html>
