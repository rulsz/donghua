<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZ Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 30px; }
    header { position: sticky; top: 0; z-index: 100; background: #0f172a; border-bottom: 1px solid #1e293b; padding: 14px 16px; }
    .brand-title { font-size: 18px; font-weight: 800; color: #38bdf8; text-align: center; }
    .container { max-width: 1000px; margin: 16px auto; padding: 0 16px; }
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #f1f5f9; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .card { background: #1e293b; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
    .poster-box { position: relative; width: 100%; aspect-ratio: 3/4; background: #0f172a; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; }
    .badge-ep { position: absolute; bottom: 6px; right: 6px; background: rgba(56, 189, 248, 0.9); color: #000; font-weight: 800; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .card-info { padding: 8px; }
    .card-title { font-size: 12px; font-weight: 700; line-height: 1.3; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">RZ STREAM</div>
  </header>

  <div class="container">
    <div class="section-title">Update Terbaru</div>
    <div class="grid-container" id="animeGrid">Memuat data...</div>
  </div>

  <script>
    async function loadAnime() {
      const grid = document.getElementById('animeGrid');
      try {
        const res = await fetch('/api/detail').then(r => r.json());
        
        if (res.success && res.data && res.data.length > 0) {
          grid.innerHTML = '';
          res.data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => window.location.href = `/detail.html?slug=${encodeURIComponent(item.slug)}`;
            card.innerHTML = `
              <div class="poster-box">
                <img src="${item.poster}" alt="${item.title}" loading="lazy">
                <span class="badge-ep">${item.episode || 'Ongoing'}</span>
              </div>
              <div class="card-info">
                <div class="card-title">${item.title}</div>
              </div>
            `;
            grid.appendChild(card);
          });
        } else {
          grid.innerHTML = 'Gagal memuat data.';
        }
      } catch (e) {
        grid.innerHTML = 'Terjadi kesalahan sistem.';
      }
    }

    window.onload = loadAnime;
  </script>
</body>
</html>
