<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anichin - Rilisan Terbaru</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 10px; margin-bottom: 20px; }
    h1 { color: #38bdf8; font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .badge { background: #0284c7; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 185px; object-fit: cover; background: #334155; }
    .card-title { padding: 8px; font-size: 12px; font-weight: bold; height: 45px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
    
    #statusMsg { text-align: center; margin-top: 40px; font-size: 14px; color: #94a3b8; }

    /* Navigasi Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 30px; padding: 10px 0; }
    .btn { background-color: #0284c7; color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: background 0.2s; }
    .btn:hover { background-color: #0369a1; }
    .page-info { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥 Rilisan Terbaru <span class="badge" id="totalCount">0</span></h1>
    </header>

    <div id="statusMsg">Memuat rilisan terbaru...</div>
    <div class="grid" id="donghuaGrid"></div>

    <!-- Tombol Pagination -->
    <div class="pagination" id="paginationNav" style="display: none;">
      <button class="btn" id="prevBtn" onclick="changePage(-1)">← Sebelumnya</button>
      <span class="page-info">Halaman <strong id="pageDisplay" style="color: #38bdf8;">1</strong></span>
      <button class="btn" id="nextBtn" onclick="changePage(1)">Selanjutnya →</button>
    </div>
  </div>

  <script>
    let currentPage = 1;

    // Ambil nomor halaman dari URL saat pertama kali dibuka (contoh: ?page=2)
    function getPageFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const page = parseInt(urlParams.get('page'));
      return page && page > 0 ? page : 1;
    }

    // Perbarui URL browser tanpa reload halaman
    function updateURL(page) {
      const newUrl = page > 1 ? `?page=${page}` : window.location.pathname;
      window.history.pushState({ page: page }, '', newUrl);
    }

    window.onload = () => {
      currentPage = getPageFromURL();
      loadData(currentPage);
    };

    // Mendukung tombol Back/Forward browser
    window.onpopstate = (event) => {
      currentPage = getPageFromURL();
      loadData(currentPage);
    };

    async function loadData(page) {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('donghuaGrid');
      const totalCount = document.getElementById('totalCount');
      const paginationNav = document.getElementById('paginationNav');
      const prevBtn = document.getElementById('prevBtn');
      const pageDisplay = document.getElementById('pageDisplay');

      window.scrollTo({ top: 0, behavior: 'smooth' });

      status.style.display = 'block';
      status.innerText = `Memuat data halaman ${page}...`;
      grid.innerHTML = '';
      paginationNav.style.display = 'none';

      try {
        const response = await fetch(`/api/donghua?page=${page}`);
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          status.style.display = 'none';
          totalCount.innerText = result.total;
          pageDisplay.innerText = page;

          // Sembunyikan tombol "Sebelumnya" jika di Halaman 1
          if (page <= 1) {
            prevBtn.style.display = 'none';
          } else {
            prevBtn.style.display = 'inline-block';
          }

          result.data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => window.open(item.href, '_blank');
            card.innerHTML = `
              <img src="${item.poster}" alt="${item.title}" loading="lazy" />
              <div class="card-title">${item.title}</div>
            `;
            grid.appendChild(card);
          });

          paginationNav.style.display = 'flex';
        } else {
          status.innerText = 'Data tidak ditemukan di halaman ini.';
        }
      } catch (err) {
        status.innerText = 'Terjadi kesalahan saat memuat halaman.';
        console.error(err);
      }
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      updateURL(currentPage);
      loadData(currentPage);
    }
  </script>
</body>
</html>
