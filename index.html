<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZ Stream - Donghua</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 40px; }
    
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; margin-bottom: 12px; }
    .section-title { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .see-all-btn { color: #38bdf8; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .see-all-btn:hover { text-decoration: underline; }

    /* Horizontal Scroll / Grid Layouts */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    
    .card { background: #1e293b; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); min-width: 130px; }
    .poster-box { position: relative; width: 100%; aspect-ratio: 3/4; background: #0f172a; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; }
    .badge-ep { position: absolute; bottom: 6px; right: 6px; background: rgba(56, 189, 248, 0.9); color: #000; font-weight: 800; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .card-info { padding: 8px; }
    .card-title { font-size: 12px; font-weight: 700; line-height: 1.3; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Dialog Modal Overlay */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; backdrop-filter: blur(4px); }
    .modal-content { position: relative; width: 90%; max-width: 900px; height: 85vh; background: #0f172a; margin: 5vh auto; border-radius: 12px; border: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 16px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; font-weight: bold; }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    
    .load-more-btn { display: block; width: 100%; padding: 12px; margin-top: 16px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
    .load-more-btn:disabled { background: #334155; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. Lanjutkan Menonton -->
    <div class="section-header" id="continueHeader" style="display:none;">
      <div class="section-title">Lanjutkan Menonton</div>
    </div>
    <div class="horizontal-scroll" id="continueContainer"></div>

    <!-- 2. Populer Hari Ini -->
    <div class="section-header">
      <div class="section-title">Populer Hari Ini</div>
    </div>
    <div class="horizontal-scroll" id="popularTodayContainer">Memuat data...</div>

    <!-- 3. Donghua Terbaru (15 List) -->
    <div class="section-header">
      <div class="section-title">Donghua Terbaru</div>
      <span class="see-all-btn" onclick="openModal()">Lihat semua</span>
    </div>
    <div class="grid-container" id="latestContainer">Memuat data...</div>

    <!-- 4. Donghua Populer -->
    <div class="section-header">
      <div class="section-title">Donghua Populer</div>
    </div>
    <div class="grid-container" id="popularAllContainer">Memuat data...</div>

  </div>

  <!-- Modal Dialog Lihat Semua -->
  <div class="modal-overlay" id="allModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Semua Donghua Terbaru</div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="grid-container" id="modalGrid"></div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreModalData()">Muat Lainnya</button>
      </div>
    </div>
  </div>

  <script>
    let modalPage = 1;

    // Load Lanjutkan Menonton dari LocalStorage
    function loadContinueWatching() {
      const history = JSON.parse(localStorage.getItem('rz_history') || '[]');
      const container = document.getElementById('continueContainer');
      const header = document.getElementById('continueHeader');

      if (history.length > 0) {
        header.style.display = 'flex';
        container.innerHTML = '';
        history.forEach(item => {
          container.appendChild(createCard(item));
        });
      }
    }

    // Generator Komponen Card
    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => window.location.href = `/detail.html?slug=${encodeURIComponent(item.slug)}`;
      card.innerHTML = `
        <div class="poster-box">
          <img src="${item.poster}" alt="${item.title}" loading="lazy">
          <span class="badge-ep">${item.episode || 'Ongoing'}</span>
        </div>
        <div class="card-info">
          <div class="card-title">${item.title}</div>
        </div>
      `;
      return card;
    }

    // Load Beranda Utama
    async function loadHome() {
      loadContinueWatching();
      try {
        const res = await fetch('/api/donghua?type=all').then(r => r.json());
        if (res.success && res.data) {
          
          // Render Populer Hari Ini
          const popTodayBox = document.getElementById('popularTodayContainer');
          popTodayBox.innerHTML = '';
          (res.data.popularToday || []).forEach(item => popTodayBox.appendChild(createCard(item)));

          // Render Donghua Terbaru (Maks 15)
          const latestBox = document.getElementById('latestContainer');
          latestBox.innerHTML = '';
          (res.data.latest || []).forEach(item => latestBox.appendChild(createCard(item)));

          // Render Donghua Populer
          const popAllBox = document.getElementById('popularAllContainer');
          popAllBox.innerHTML = '';
          (res.data.popularAll || []).forEach(item => popAllBox.appendChild(createCard(item)));
        }
      } catch (e) {
        console.error('Gagal memuat data beranda', e);
      }
    }

    // Fungsi Dialog Modal
    function openModal() {
      document.getElementById('allModal').style.display = 'block';
      if (modalPage === 1 && document.getElementById('modalGrid').children.length === 0) {
        loadMoreModalData();
      }
    }

    function closeModal() {
      document.getElementById('allModal').style.display = 'none';
    }

    // Fetch pagination 30 data untuk Dialog
    async function loadMoreModalData() {
      const btn = document.getElementById('loadMoreBtn');
      btn.innerText = 'Memuat...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/donghua?type=latest&page=${modalPage}`).then(r => r.json());
        if (res.success && res.data && res.data.length > 0) {
          const grid = document.getElementById('modalGrid');
          res.data.forEach(item => grid.appendChild(createCard(item)));
          modalPage++;
          btn.innerText = 'Muat Lainnya';
          btn.disabled = false;
        } else {
          btn.innerText = 'Tidak Ada Data Lagi';
        }
      } catch (e) {
        btn.innerText = 'Gagal Memuat';
        btn.disabled = false;
      }
    }

    window.onload = loadHome;
  </script>
</body>
</html>
