<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZ Media Player - Beranda</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: #000000; 
      color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-top: 70px; 
      padding-bottom: 30px; 
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      background: rgba(0, 0, 0, 0.9); 
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px; 
    }
    .header-content { 
      max-width: 1000px; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
    }
    .brand-logo { font-size: 18px; font-weight: 800; color: #38bdf8; text-decoration: none; }

    /* Search Bar */
    .search-box { 
      display: flex; align-items: center; background: #111827; 
      border: 1px solid #1e293b; border-radius: 20px; 
      padding: 6px 14px; width: 100%; max-width: 280px; 
    }
    .search-input { 
      background: transparent; border: none; color: #fff; 
      font-size: 14px; width: 100%; outline: none; 
    }
    .search-input::placeholder { color: #64748b; }

    /* Section Titles */
    .section-title { font-size: 16px; font-weight: 800; margin: 20px 0 12px 0; color: #f8fafc; display: flex; align-items: center; gap: 8px; }

    /* Continue Watching Carousel */
    .history-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .history-scroll::-webkit-scrollbar { display: none; }
    .history-card { 
      flex: 0 0 140px; background: #111827; border: 1px solid #1e293b; 
      border-radius: 12px; overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; 
    }
    .history-poster { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #1e293b; }
    .history-info { padding: 8px; }
    .history-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-ep { font-size: 11px; color: #38bdf8; margin-top: 2px; }

    /* Media Grid */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .media-card { 
      background: #111827; border: 1px solid #1e293b; border-radius: 12px; 
      overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; 
    }
    .media-poster-box { width: 100%; aspect-ratio: 3/4; background: #1e293b; position: relative; }
    .media-poster { width: 100%; height: 100%; object-fit: cover; }
    .media-badge { 
      position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); 
      backdrop-filter: blur(4px); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; color: #38bdf8; 
    }
    .media-info { padding: 8px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
    .media-name { font-size: 12px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }

    /* Loading / Empty State */
    .loading-text, .empty-state { text-align: center; color: #64748b; font-size: 13px; padding: 30px 0; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="/" class="brand-logo">RZ Media</a>
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Cari donghua..." onkeypress="handleSearch(event)">
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Continue Watching Section -->
    <div id="continueSection" style="display: none;">
      <h2 class="section-title">Lanjutkan Tontonan</h2>
      <div class="history-scroll" id="historyContainer"></div>
    </div>

    <!-- Main Grid Section -->
    <h2 class="section-title" id="gridTitle">Rekomendasi Terbaru</h2>
    <div class="media-grid" id="mediaGrid">
      <div class="loading-text">Memuat daftar media...</div>
    </div>
  </div>

  <script>
    function cleanSlug(str) {
      if (!str) return '';
      return String(str)
        .replace(/^https?:\/\/[^\/]+/, '')
        .replace(/^\/?detail\//, '')
        .replace(/^\/?anime\//, '')
        .replace(/^\/?movie\//, '')
        .replace(/^\/+|\/+$/g, '');
    }

    async function loadHomeData() {
      renderHistory();
      
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '<div class="loading-text">Memuat daftar media...</div>';

      try {
        const res = await fetch('/api/donghua').then(r => r.json());
        if (res && res.success && res.data) {
          renderGrid(res.data);
        } else {
          grid.innerHTML = '<div class="empty-state">Gagal memuat data media.</div>';
        }
      } catch (e) {
        grid.innerHTML = '<div class="empty-state">Terjadi kesalahan jaringan.</div>';
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';

      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="empty-state">Tidak ada media ditemukan.</div>';
        return;
      }

      items.forEach(item => {
        const slug = cleanSlug(item.slug || item.url);
        const card = document.createElement('a');
        card.className = 'media-card';
        card.href = `/detail/${slug}`;

        card.innerHTML = `
          <div class="media-poster-box">
            <img class="media-poster" src="${item.poster || ''}" alt="${item.title}" loading="lazy">
            ${item.episode ? `<span class="media-badge">${item.episode}</span>` : ''}
          </div>
          <div class="media-info">
            <span class="media-name">${item.title}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        const grid = document.getElementById('mediaGrid');
        const gridTitle = document.getElementById('gridTitle');

        if (!query) {
          gridTitle.innerText = 'Rekomendasi Terbaru';
          loadHomeData();
          return;
        }

        gridTitle.innerText = `Hasil Pencarian: "${query}"`;
        grid.innerHTML = '<div class="loading-text">Mencari...</div>';

        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`).then(r => r.json());
          if (res && res.success && res.data) {
            renderGrid(res.data);
          } else {
            grid.innerHTML = '<div class="empty-state">Pencarian tidak ditemukan.</div>';
          }
        } catch (err) {
          grid.innerHTML = '<div class="empty-state">Gagal melakukan pencarian.</div>';
        }
      }
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      const section = document.getElementById('continueSection');
      const container = document.getElementById('historyContainer');

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      container.innerHTML = '';

      history.forEach(item => {
        const card = document.createElement('a');
        card.className = 'history-card';
        card.href = `/detail/${item.mainPath}`;

        card.innerHTML = `
          <img class="history-poster" src="${item.poster || ''}" alt="${item.title}" loading="lazy">
          <div class="history-info">
            <div class="history-name">${item.title}</div>
            <div class="history-ep">${item.episode || 'Episode'}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.onload = loadHomeData;
  </script>
</body>
</html>
