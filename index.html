<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RZ Donghua</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 40px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    /* Header Modern Lightweight */
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 18px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    
    .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Section Styling */
    .section-block { margin-top: 20px; }
    .section-title { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .section-subtitle { font-size: 12px; color: #64748b; margin-bottom: 14px; }

    /* Layout Lanjutkan Menonton (3 Item + Scroll Horizontal) */
    .scroll-row { 
      display: flex; 
      gap: 12px; 
      overflow-x: auto; 
      padding-bottom: 8px; 
      scrollbar-width: none; 
      scroll-snap-type: x mandatory; 
    }
    .scroll-row::-webkit-scrollbar { display: none; }
    
    .card-continue { 
      /* Formula agar muat pas 3 item tampilan layar di minus gap */
      flex: 0 0 calc((100% - 24px) / 3); 
      min-width: calc((100% - 24px) / 3); 
      scroll-snap-align: start; 
      cursor: pointer; 
    }
    .card-continue-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #1e293b; }
    .card-continue img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { position: absolute; top: 8px; left: 8px; background: rgba(56, 189, 248, 0.9); color: #0f172a; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
    .close-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .close-btn svg { width: 12px; height: 12px; stroke: #ffffff; stroke-width: 2.5; }

    /* Layout Grid Rilisan Terbaru (3 Item Horizontal) */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #1e293b; }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    .badge-bottom { position: absolute; bottom: 8px; left: 8px; background: rgba(255, 255, 255, 0.9); color: #0f172a; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 10px; }

    /* Title Styling */
    .card-title { margin-top: 6px; font-size: 12px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }

    /* Status & Pagination */
    #statusMsg { text-align: center; margin: 30px 0; font-size: 13px; color: #64748b; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 30px; }
    .btn { background-color: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 16px; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .page-info { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Top Header -->
    <header>
      <div class="header-left">
        <!-- SVG Menu Icon -->
        <button class="icon-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="brand-title">RZ Donghua</span>
      </div>
      <div class="header-right">
        <!-- SVG Search Icon -->
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
    </header>

    <!-- Section: Lanjutkan Menonton (3 Item Visible + Scrollable) -->
    <section class="section-block" id="continueSection" style="display: none;">
      <h2 class="section-title">Lanjutkan Menonton</h2>
      <div class="scroll-row" id="continueRow"></div>
    </section>

    <!-- Section: Rilisan Terbaru (3 Kolom Horizontal) -->
    <section class="section-block">
      <h2 class="section-title">Rilisan Terbaru</h2>
      <p class="section-subtitle">Update Donghua Terbaru</p>
      
      <div id="statusMsg">Memuat data...</div>
      <div class="grid-3" id="donghuaGrid"></div>

      <!-- Pagination Navigation -->
      <div class="pagination" id="paginationNav" style="display: none;">
        <button class="btn" id="prevBtn" onclick="changePage(-1)">← Sebelumnya</button>
        <span class="page-info">Halaman <strong id="pageDisplay" style="color: #38bdf8;">1</strong></span>
        <button class="btn" id="nextBtn" onclick="changePage(1)">Selanjutnya →</button>
      </div>
    </section>

  </div>

  <script>
    let currentPage = 1;

    function getPageFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const page = parseInt(urlParams.get('page'));
      return page && page > 0 ? page : 1;
    }

    function updateURL(page) {
      const newUrl = page > 1 ? `?page=${page}` : window.location.pathname;
      window.history.pushState({ page: page }, '', newUrl);
    }

    window.onload = () => {
      renderContinueWatching();
      currentPage = getPageFromURL();
      loadData(currentPage);
    };

    window.onpopstate = () => {
      currentPage = getPageFromURL();
      loadData(currentPage);
    };

    // Render Data Lanjutkan Menonton (Tersimpan di LocalStorage Perangkat)
    function renderContinueWatching() {
      const history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');

      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';
      row.innerHTML = '';

      history.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-continue';
        card.innerHTML = `
          <div class="card-continue-img-wrapper" onclick="openDonghua('${item.href}', '${item.title}', '${item.poster}')">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-ep">Lanjut</span>
            <button class="close-btn" onclick="event.stopPropagation(); removeHistory(${index})" aria-label="Hapus">
              <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        row.appendChild(card);
      });
    }

    function removeHistory(index) {
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      history.splice(index, 1);
      localStorage.setItem('rz_continue_history', JSON.stringify(history));
      renderContinueWatching();
    }

    function openDonghua(href, title, poster) {
      // Simpan riwayat menonton ke LocalStorage perangkat
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      history = history.filter(item => item.href !== href);
      history.unshift({ href, title, poster });
      localStorage.setItem('rz_continue_history', JSON.stringify(history.slice(0, 15)));

      window.open(href, '_blank');
      renderContinueWatching();
    }

    async function loadData(page) {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('donghuaGrid');
      const paginationNav = document.getElementById('paginationNav');
      const prevBtn = document.getElementById('prevBtn');
      const pageDisplay = document.getElementById('pageDisplay');

      window.scrollTo({ top: 0, behavior: 'smooth' });

      status.style.display = 'block';
      status.innerText = `Memuat halaman ${page}...`;
      grid.innerHTML = '';
      paginationNav.style.display = 'none';

      try {
        const response = await fetch(`/api/donghua?page=${page}`);
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          status.style.display = 'none';
          pageDisplay.innerText = page;

          prevBtn.style.display = page <= 1 ? 'none' : 'inline-block';

          result.data.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'card-grid';
            card.onclick = () => openDonghua(item.href, item.title, item.poster);
            card.innerHTML = `
              <div class="card-grid-img-wrapper">
                <img src="${item.poster}" alt="${item.title}" loading="lazy" />
                <span class="badge-bottom">EP ${i + 1}</span>
              </div>
              <div class="card-title">${item.title}</div>
            `;
            grid.appendChild(card);
          });

          paginationNav.style.display = 'flex';
        } else {
          status.innerText = 'Data tidak ditemukan.';
        }
      } catch (err) {
        status.innerText = 'Gagal terhubung ke API Server.';
        console.error(err);
      }
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      updateURL(currentPage);
      loadData(currentPage);
    }
  </script>
</body>
</html>
