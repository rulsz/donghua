<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tabTitle">RZSTREAM - Streaming Donghua Sub Indo</title>

  <style>
    :root {
      --bg-main: #030712;
      --blue-accent: #0284c7;
      --cyan-bright: #38bdf8;
      --card-bg: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-bottom: 40px; 
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    /* Header Outer Container */
    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      padding: 10px 12px; 
      pointer-events: none;
      transition: padding 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    /* Header Content (Pill Bar & Transparan Transisi) */
    .header-content { 
      max-width: 100%; width: 100%; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
      position: relative; 
      height: 52px; 
      padding: 0 8px; 
      border-radius: 26px;
      pointer-events: auto;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Saat di-scroll: Menyempit ke Tengah Membentuk Kapsul Melayang */
    header.scrolled { padding: 10px 20px; }
    header.scrolled .header-content {
      max-width: 880px; 
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    
    .header-normal-group { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .header-left-group { display: flex; align-items: center; gap: 12px; }
    .header-right-group { display: flex; align-items: center; gap: 8px; }

    .icon-circle-btn { 
      background: rgba(15, 23, 42, 0.6); 
      backdrop-filter: blur(12px);
      color: #ffffff; 
      border-radius: 50%; 
      width: 38px; height: 38px; 
      cursor: pointer; 
      display: flex; align-items: center; justify-content: center; 
      border: 1px solid rgba(56, 189, 248, 0.2);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-circle-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .brand-title { font-size: 22px; font-weight: 900; color: var(--cyan-bright); letter-spacing: 0.5px; text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

    /* Dropdown Navigation Menu */
    .menu-dropdown {
      display: none;
      position: absolute;
      top: 60px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 8px;
      min-width: 170px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 101;
    }
    .menu-dropdown.active { display: block; }
    .menu-dropdown a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      color: #f8fafc;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .menu-dropdown a:hover { background: rgba(56, 189, 248, 0.15); color: var(--cyan-bright); }

    /* Search Box */
    .header-search-box { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; align-items: center; gap: 10px; z-index: 10; }
    .header-search-box.active { display: flex; }
    .search-input-header { flex: 1; height: 38px; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); padding: 0 18px; border-radius: 19px; color: #ffffff; font-size: 14px; outline: none; }
    .search-results-dropdown { display: none; position: fixed; top: 68px; left: 0; right: 0; background: var(--bg-main); z-index: 99; padding: 16px; max-height: calc(100vh - 68px); overflow-y: auto; border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
    .search-results-dropdown.active { display: block; }

    /* Hero Slider Container */
    .hero-slider-wrapper { position: relative; width: 100%; height: 500px; overflow: hidden; background: #000; }
    .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease-in-out; display: flex; align-items: flex-end; }
    .hero-slide.active { opacity: 1; z-index: 1; }
    .hero-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--bg-main) 15%, rgba(3, 7, 18, 0.6) 55%, rgba(3, 7, 18, 0.2) 100%); }
    
    .hero-content { position: relative; z-index: 2; padding: 20px 20px 45px 20px; max-width: 600px; }
    .badge-tag { display: inline-block; background: var(--blue-accent); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; }
    .hero-title { font-size: 24px; font-weight: 900; line-height: 1.2; color: #fff; margin-bottom: 8px; text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; }
    .rating-star { color: #f59e0b; font-weight: 800; display: flex; align-items: center; gap: 4px; }
    .badge-status-green { background: rgba(56, 189, 248, 0.15); color: var(--cyan-bright); border: 1px solid rgba(56, 189, 248, 0.4); font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    
    .btn-watch { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-watch svg { width: 16px; height: 16px; fill: currentColor; }

    /* Indikator Slider Dots (Terkunci Di Dalam Hero Slider) */
    .slider-dots { position: absolute; bottom: 16px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; cursor: pointer; transition: all 0.3s; }
    .dot.active { width: 28px; background: var(--cyan-bright); border-radius: 10px; }

    /* Section Content */
    .section-block { margin-top: 24px; }
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #f8fafc; }

    .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    
    .card-continue { flex: 0 0 calc((100% - 24px) / 3); min-width: calc((100% - 24px) / 3); cursor: pointer; }
    .card-continue-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: var(--card-bg); border: 1px solid rgba(56, 189, 248, 0.1); }
    .card-continue img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { position: absolute; top: 8px; left: 8px; background: rgba(14, 165, 233, 0.95); color: #030712; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: var(--card-bg); border: 1px solid rgba(56, 189, 248, 0.1); }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-bottom { position: absolute; bottom: 8px; left: 8px; max-width: calc(100% - 16px); background: rgba(15, 23, 42, 0.85); color: var(--cyan-bright); border: 1px solid rgba(56, 189, 248, 0.2); font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .see-all-btn { color: var(--cyan-bright); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>

  <header id="mainHeader">
    <div class="header-content">
      <div class="header-normal-group">
        <div class="header-left-group">
          <span class="brand-title" id="displayBrandTitle">RZSTREAM</span>
        </div>
        <div class="header-right-group">
          <button class="icon-circle-btn" onclick="toggleSearch()">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="icon-circle-btn" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>

      <!-- Menu Navigasi Dropdown -->
      <div class="menu-dropdown" id="menuDropdown">
        <a href="/dashboard">⚙️ Admin Dashboard</a>
        <a href="/latest">🔥 Donghua Terbaru</a>
      </div>

      <div class="header-search-box" id="headerSearchBox">
        <input type="text" class="search-input-header" id="searchInputHeader" placeholder="Cari judul..." onkeyup="handleSearchInput(event)">
        <button class="icon-circle-btn" onclick="toggleSearch()">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="search-results-dropdown" id="searchResultsDropdown">
    <h3 class="section-title">Hasil Pencarian</h3>
    <div class="grid-3" id="searchResultGrid"></div>
  </div>

  <!-- Hero Slider -->
  <div class="hero-slider-wrapper" id="heroSlider">
    <div class="slider-dots" id="sliderDots"></div>
  </div>

  <div class="container">
    <!-- 1. Lanjutkan Menonton -->
    <section class="section-block" id="continueSection" style="display: none;">
      <h2 class="section-title">Lanjutkan Menonton</h2>
      <div class="scroll-row" id="continueRow"></div>
    </section>

    <!-- 2. Populer Hari Ini -->
    <section class="section-block">
      <h2 class="section-title">Populer Hari Ini</h2>
      <div class="scroll-row" id="popularTodayRow">Memuat...</div>
    </section>

    <!-- 3. Donghua Terbaru -->
    <section class="section-block">
      <div class="section-header-flex">
        <h2 class="section-title" style="margin-bottom: 0;">Donghua Terbaru</h2>
        <a href="/latest" class="see-all-btn">Lihat Semua</a>
      </div>
      <div class="grid-3" id="latestGrid" style="margin-top: 14px;">Memuat...</div>
    </section>

    <!-- 4. Donghua Populer -->
    <section class="section-block">
      <h2 class="section-title">Donghua Populer</h2>
      <div class="grid-3" id="popularAllGrid">Memuat...</div>
    </section>
  </div>

  <script>
    let searchTimer = null;
    let currentSlide = 0;
    let slideInterval = null;

    // Load Pengaturan Global dari Server
    async function applyDashboardSettings() {
      try {
        const res = await fetch('/api/settings').then(r => r.json());
        if (res.success && res.settings) {
          if (res.settings.brandTitle) document.getElementById('displayBrandTitle').innerText = res.settings.brandTitle;
          if (res.settings.pageTitle) document.title = res.settings.pageTitle;
        }
      } catch (e) {
        const savedBrand = localStorage.getItem('rz_brand_title');
        const savedPageTitle = localStorage.getItem('rz_page_title');
        if (savedBrand) document.getElementById('displayBrandTitle').innerText = savedBrand;
        if (savedPageTitle) document.title = savedPageTitle;
      }
    }

    // Scroll Listener untuk Animasi Menyempitkan Header
    window.addEventListener('scroll', () => {
      const header = document.getElementById('mainHeader');
      if (window.scrollY > 15) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });

    function cleanPath(input) {
      if (!input) return '';
      return String(input)
        .replace(/^https?:\/\/[^\/]+/, '')
        .replace(/^\/detail\//, '')
        .replace(/^\/anime\//, '')
        .replace(/^\/movie\//, '')
        .replace(/^\/+|\/+$/g, '');
    }

    function toggleMenu() {
      const dropdown = document.getElementById('menuDropdown');
      dropdown.classList.toggle('active');
    }

    function toggleSearch() {
      const searchBox = document.getElementById('headerSearchBox');
      const dropdown = document.getElementById('searchResultsDropdown');
      searchBox.classList.toggle('active');
      if (!searchBox.classList.contains('active')) dropdown.classList.remove('active');
    }

    function handleSearchInput(event) {
      const query = event.target.value.trim();
      const dropdown = document.getElementById('searchResultsDropdown');
      const resultGrid = document.getElementById('searchResultGrid');

      clearTimeout(searchTimer);
      if (query === '') { dropdown.classList.remove('active'); return; }

      dropdown.classList.add('active');
      resultGrid.innerHTML = '<p style="color: #64748b; font-size: 13px; grid-column: span 3; text-align: center;">Mencari...</p>';

      searchTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`).then(r => r.json());
          resultGrid.innerHTML = '';
          if (res.success && res.data && res.data.length > 0) {
            renderGridItems(res.data, resultGrid);
          } else {
            resultGrid.innerHTML = '<p style="color: #64748b; font-size: 13px; grid-column: span 3; text-align: center;">Tidak ditemukan.</p>';
          }
        } catch (e) {
          resultGrid.innerHTML = '<p style="color: #ef4444; font-size: 13px; grid-column: span 3; text-align: center;">Gagal memuat hasil.</p>';
        }
      }, 400);
    }

    function goToDetail(slug) {
      window.location.href = `/detail/${cleanPath(slug)}`;
    }

    function renderHeroSlider(items) {
      const slider = document.getElementById('heroSlider');
      slider.innerHTML = '';

      const sliderItems = items.slice(0, 5);
      sliderItems.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
        
        slide.innerHTML = `
          <img class="hero-bg-img" src="${item.poster}" alt="${item.title}" />
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="badge-tag">DONGHUA</span>
            <h1 class="hero-title">${item.title}</h1>
            <div class="hero-meta">
              <span class="rating-star">★ 9.0</span>
              <span>•</span>
              <span class="badge-status-green">${item.status || 'ONGOING'}</span>
              <span>•</span>
              <span>${item.episode || 'Ep 1'}</span>
            </div>
            <button class="btn-watch" onclick="goToDetail('${item.slug}')">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Tonton
            </button>
          </div>
        `;
        slider.appendChild(slide);
      });

      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'slider-dots';
      dotsContainer.id = 'sliderDots';

      sliderItems.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => setSlide(index);
        dotsContainer.appendChild(dot);
      });

      slider.appendChild(dotsContainer);
      startSliderAutoPlay(sliderItems.length);
    }

    function setSlide(index) {
      const slides = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.dot');
      if (slides.length === 0) return;

      slides[currentSlide].classList.remove('active');
      if (dots[currentSlide]) dots[currentSlide].classList.remove('active');

      currentSlide = index;

      slides[currentSlide].classList.add('active');
      if (dots[currentSlide]) dots[currentSlide].classList.add('active');
    }

    function startSliderAutoPlay(total) {
      clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        let next = (currentSlide + 1) % total;
        setSlide(next);
      }, 4000);
    }

    function createGridCard(item) {
      const card = document.createElement('div');
      card.className = 'card-grid';
      card.onclick = () => goToDetail(item.slug || '');

      const title = item.title || 'Donghua';
      const poster = item.poster || '';
      const statusText = item.status || 'Ongoing';
      const epText = item.episode || 'Ep 1';

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${poster}" alt="${title}" loading="lazy" />
          <span class="badge-ep">${statusText}</span>
          <span class="badge-bottom">${epText}</span>
        </div>
        <div class="card-title">${title}</div>
      `;
      return card;
    }

    function createScrollCard(item) {
      const card = document.createElement('div');
      card.className = 'card-continue';
      card.onclick = () => goToDetail(item.slug || '');

      const title = item.title || 'Donghua';
      const poster = item.poster || '';
      const statusText = item.status || 'Ongoing';
      const epText = item.episode || 'Ep 1';

      card.innerHTML = `
        <div class="card-continue-img-wrapper">
          <img src="${poster}" alt="${title}" loading="lazy" />
          <span class="badge-ep">${statusText}</span>
          <span class="badge-bottom">${epText}</span>
        </div>
        <div class="card-title">${title}</div>
      `;
      return card;
    }

    function renderGridItems(list, targetElement) {
      if (!targetElement) return;
      targetElement.innerHTML = '';
      if (Array.isArray(list) && list.length > 0) {
        list.forEach(item => {
          if (item && item.title) {
            targetElement.appendChild(createGridCard(item));
          }
        });
      } else {
        targetElement.innerHTML = '<p style="color: #64748b; font-size: 12px; grid-column: span 3;">Data tidak tersedia.</p>';
      }
    }

    async function loadMainContent() {
      const popRow = document.getElementById('popularTodayRow');
      const latestGrid = document.getElementById('latestGrid');
      const popAllGrid = document.getElementById('popularAllGrid');

      try {
        const res = await fetch('/api/donghua?type=all').then(r => r.json());

        if (res && res.success && res.data) {
          if (res.data.popularToday && res.data.popularToday.length > 0) {
            renderHeroSlider(res.data.popularToday);
          }

          if (popRow) {
            popRow.innerHTML = '';
            const popToday = res.data.popularToday || [];
            if (popToday.length > 0) {
              popToday.forEach(item => popRow.appendChild(createScrollCard(item)));
            } else {
              popRow.innerText = 'Data tidak tersedia.';
            }
          }

          if (latestGrid) {
            renderGridItems(res.data.latest || [], latestGrid);
          }

          if (popAllGrid) {
            renderGridItems(res.data.popularAll || [], popAllGrid);
          }
        }
      } catch (e) {
        console.error('Gagal memuat beranda:', e);
      }
    }

    function renderContinueWatching() {
      const history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');

      if (!history || history.length === 0) { container.style.display = 'none'; return; }
      container.style.display = 'block';
      row.innerHTML = '';

      history.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card-continue';
        card.onclick = () => goToDetail(item.mainPath);

        card.innerHTML = `
          <div class="card-continue-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-ep">${item.episode || 'Lanjut'}</span>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        row.appendChild(card);
      });
    }

    window.onload = () => {
      applyDashboardSettings();
      renderContinueWatching();
      loadMainContent();
    };
  </script>
</body>
</html>
