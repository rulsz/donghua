<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZ Media Player</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: #000000; 
      color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-top: 68px; 
      padding-bottom: 90px; 
      transition: background 0.3s, color 0.3s; 
    }
    
    body.light-mode { background-color: #f8fafc; color: #0b0f19; }
    body.light-mode header { 
      background: linear-gradient(to bottom, rgba(248, 250, 252, 0.95) 0%, rgba(248, 250, 252, 0.6) 70%, rgba(248, 250, 252, 0) 100%); 
    }
    body.light-mode .brand-title { color: #0b0f19 !important; }
    body.light-mode .icon-circle-btn { 
      background: rgba(0, 0, 0, 0.05); 
      border: 1px solid rgba(0, 0, 0, 0.08); 
      color: #0b0f19; 
    }
    body.light-mode .bottom-nav-container {
      background: rgba(240, 243, 248, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    body.light-mode .badge-bottom {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(0, 0, 0, 0.15);
      color: #0284c7;
    }
    body.light-mode .ep-box { background: #e2e8f0; border-color: #cbd5e1; color: #0b0f19; }
    body.light-mode .ep-box.active { background: #9333ea; border-color: #a855f7; color: #ffffff; }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 70%, rgba(0, 0, 0, 0) 100%); 
      padding: 10px 16px 16px 16px; 
      pointer-events: none;
    }
    .header-content { 
      max-width: 1000px; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
      position: relative; height: 44px; 
      pointer-events: auto;
    }
    
    .header-normal-group { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .header-left-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }

    .icon-circle-btn { 
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px);
      color: #ffffff; 
      border-radius: 50%; 
      width: 44px; height: 44px; 
      cursor: pointer; 
      display: flex; align-items: center; justify-content: center; 
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .icon-circle-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .brand-title { font-size: 17px; font-weight: 700; color: #ffffff; }

    .bottom-nav-wrapper {
      position: fixed; bottom: 16px; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
    }
    .bottom-nav-wrapper.hidden { display: none !important; }

    .bottom-nav-container {
      pointer-events: auto; display: flex; align-items: center; justify-content: space-around;
      width: 100%; max-width: 420px; height: 62px; padding: 4px 6px;
      background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(16px);
      border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-item {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; color: #94a3b8;
      text-decoration: none; border-radius: 28px; cursor: pointer;
    }
    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item span { font-size: 11px; font-weight: 600; }
    .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #38bdf8; }

    .section-block { margin-top: 24px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #111827; }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-bottom { 
      position: absolute; bottom: 8px; left: 8px; max-width: calc(100% - 16px);
      background: rgba(18, 24, 38, 0.85); color: #38bdf8; border: 1px solid rgba(255, 255, 255, 0.18); 
      font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    #detailView { display: none; }
    .player-wrapper { margin-left: -16px; margin-right: -16px; width: calc(100% + 32px); background: #000; margin-bottom: 16px; }
    .detail-player-box { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
    .player-iframe { width: 100%; height: 100%; border: none; }

    .ep-scroll-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 16px; }
    .ep-box { flex: 0 0 54px; height: 54px; background: #111827; border: 1px solid #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; }
    .ep-box.active { background: #581c87; border-color: #a855f7; color: #fff; }

    #statusMsg { text-align: center; margin: 40px 0; font-size: 13px; color: #64748b; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 35px; }
    .btn { background-color: #111827; color: #38bdf8; border: 1px solid #1e293b; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-normal-group">
        <div class="header-left-group" onclick="handleLeftNavClick()">
          <button class="icon-circle-btn" id="mainNavBtn">
            <svg id="iconHamburger" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <svg id="iconBack" viewBox="0 0 24 24" style="display: none;"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span class="brand-title" id="topHeaderTitle">RZ Media</span>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="homeView">
      <section class="section-block">
        <h2 class="section-title" id="sectionTitle">Rilisan Terbaru</h2>
        <div id="statusMsg">Memuat data...</div>
        <div class="grid-3" id="mainGrid"></div>

        <div class="pagination" id="paginationNav" style="display: none;">
          <button class="btn" id="prevBtn" onclick="changePage(-1)">← Sebelumnya</button>
          <span class="page-info">Halaman <strong id="pageDisplay" style="color: #38bdf8;">1</strong></span>
          <button class="btn" id="nextBtn" onclick="changePage(1)">Selanjutnya →</button>
        </div>
      </section>
    </div>

    <div id="detailView">
      <div class="player-wrapper">
        <div class="detail-player-box" id="playerMediaContainer">Memuat video...</div>
      </div>
      <div class="detail-body">
        <div id="epContainer">
          <div class="ep-scroll-grid" id="epGrid"></div>
        </div>
        <h1 class="media-title" id="dTitle">Memuat Judul...</h1>
        <p class="synopsis-text" id="dSynopsis">Memuat deskripsi...</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav-wrapper" id="bottomNavWrapper">
    <div class="bottom-nav-container">
      <div class="nav-item active" id="tabHome" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item" id="tabDonghua" onclick="switchTab('donghua')">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 9H3V5h9v7z"/></svg>
        <span>Donghua</span>
      </div>
      <div class="nav-item" id="tabFilm" onclick="switchTab('film')">
        <svg viewBox="0 0 24 24"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
        <span>Movie</span>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'home';
    let currentPage = 1;
    let isDetailPage = false;

    function cleanPath(input) {
      if (!input) return '';
      return String(input).replace(/^https?:\/\/[^\/]+/, '').replace(/^\/anime\//, '').replace(/^\/movie\//, '').replace(/^\/+|\/+$/g, '');
    }

    function switchTab(tab) {
      currentTab = tab;
      currentPage = 1;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      if (tab === 'home') document.getElementById('tabHome').classList.add('active');
      if (tab === 'donghua') document.getElementById('tabDonghua').classList.add('active');
      if (tab === 'film') document.getElementById('tabFilm').classList.add('active');

      openPage('/');
    }

    function handleLeftNavClick() {
      if (isDetailPage) openPage('/');
    }

    function openPage(target) {
      const route = cleanPath(target);
      if (!route || target === '/') {
        window.history.pushState({}, '', '/');
      } else {
        window.history.pushState({}, '', '/' + route);
      }
      router();
    }

    window.onload = router;
    window.onpopstate = router;

    function router() {
      const rawPath = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
      const iconHamburger = document.getElementById('iconHamburger');
      const iconBack = document.getElementById('iconBack');

      if (rawPath === '') {
        isDetailPage = false;
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        iconHamburger.style.display = 'block';
        iconBack.style.display = 'none';
        document.getElementById('bottomNavWrapper').classList.remove('hidden');

        loadMainContent();
      } else {
        isDetailPage = true;
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        iconHamburger.style.display = 'none';
        iconBack.style.display = 'block';
        document.getElementById('bottomNavWrapper').classList.add('hidden');

        loadDetail(rawPath);
      }
    }

    async function loadMainContent() {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('mainGrid');
      status.style.display = 'block';
      status.innerText = 'Memuat data...';
      grid.innerHTML = '';

      try {
        let combinedData = [];

        if (currentTab === 'home') {
          document.getElementById('sectionTitle').innerText = 'Beranda (Donghua & Movie)';
          const [resDonghua, resMovie] = await Promise.all([
            fetch(`/api/donghua?page=${currentPage}`).then(r => r.json()).catch(() => ({ data: [] })),
            fetch(`/api/movie?page=${currentPage}`).then(r => r.json()).catch(() => ({ data: [] }))
          ]);

          const listDonghua = resDonghua.data || [];
          const listMovie = resMovie.data || [];

          const maxLen = Math.max(listDonghua.length, listMovie.length);
          for (let i = 0; i < maxLen; i++) {
            if (listDonghua[i]) combinedData.push(listDonghua[i]);
            if (listMovie[i]) combinedData.push(listMovie[i]);
          }
        } else if (currentTab === 'donghua') {
          document.getElementById('sectionTitle').innerText = 'Rilisan Donghua Terbaru';
          const res = await fetch(`/api/donghua?page=${currentPage}`).then(r => r.json());
          combinedData = res.data || [];
        } else if (currentTab === 'film') {
          document.getElementById('sectionTitle').innerText = 'Rilisan Movie Terbaru';
          const res = await fetch(`/api/movie?page=${currentPage}`).then(r => r.json());
          combinedData = res.data || [];
        }

        status.style.display = 'none';
        renderGrid(combinedData, grid);
        document.getElementById('paginationNav').style.display = 'flex';
        document.getElementById('pageDisplay').innerText = currentPage;
      } catch (e) {
        status.innerText = 'Gagal memuat data.';
      }
    }

    function renderGrid(list, targetGrid) {
      targetGrid.innerHTML = '';
      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-grid';
        card.onclick = () => openPage(cleanPath(item.slug));

        card.innerHTML = `
          <div class="card-grid-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-bottom">${item.type || 'Media'} ${item.episode ? '• ' + item.episode : ''}</span>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        targetGrid.appendChild(card);
      });
    }

    async function loadDetail(path) {
      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = 'Memuat player...';
      document.getElementById('dTitle').innerText = 'Memuat Judul...';
      document.getElementById('dSynopsis').innerText = 'Sedang mengambil deskripsi...';

      let res = await fetch(`/api/detail?slug=${encodeURIComponent(path)}`).then(r => r.json()).catch(() => null);
      
      if (!res || !res.success) {
        res = await fetch(`/api/movie?slug=${encodeURIComponent(path)}`).then(r => r.json()).catch(() => null);
      }

      if (res && res.success && res.data) {
        const data = res.data;
        document.getElementById('dTitle').innerText = data.title;
        document.getElementById('dSynopsis').innerText = data.synopsis;

        if (data.isMovie) {
          document.getElementById('epContainer').style.display = 'none';
          if (data.servers && data.servers.length > 0) {
            mediaBox.innerHTML = `<iframe class="player-iframe" src="${data.servers[0].url}" allowfullscreen></iframe>`;
          } else {
            mediaBox.innerHTML = 'Video film belum tersedia.';
          }
        } else {
          document.getElementById('epContainer').style.display = 'block';
          const epGrid = document.getElementById('epGrid');
          epGrid.innerHTML = '';

          (data.episodes || []).forEach((ep, i) => {
            const box = document.createElement('div');
            box.className = 'ep-box';
            box.innerText = i + 1;
            box.onclick = () => fetchAndPlayStream(ep.slug);
            epGrid.appendChild(box);
          });

          if (data.episodes && data.episodes.length > 0) {
            fetchAndPlayStream(data.episodes[0].slug);
          }
        }
      } else {
        document.getElementById('dTitle').innerText = 'Gagal Memuat Detail';
        mediaBox.innerHTML = 'Media tidak ditemukan.';
      }
    }

    async function fetchAndPlayStream(epSlug) {
      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = 'Memuat episode...';
      const res = await fetch(`/api/detail?slug=${encodeURIComponent(epSlug)}`).then(r => r.json()).catch(() => null);

      if (res && res.success && res.data && res.data.servers && res.data.servers.length > 0) {
        mediaBox.innerHTML = `<iframe class="player-iframe" src="${res.data.servers[0].url}" allowfullscreen></iframe>`;
      } else {
        mediaBox.innerHTML = 'Server video episode ini belum tersedia.';
      }
    }

    function changePage(dir) {
      currentPage += dir;
      if (currentPage < 1) currentPage = 1;
      loadMainContent();
    }
  </script>
</body>
</html>
