<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZ Donghua</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-top: 60px; padding-bottom: 50px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 12px 16px; 
    }
    .header-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand-title { font-size: 18px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; }
    
    .icon-btn { background: none; border: none; color: #f8fafc; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .search-box-wrapper { display: none; margin-top: 10px; width: 100%; }
    .search-box-wrapper.active { display: block; }
    .search-input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 10px; color: #fff; font-size: 16px !important; outline: none; }

    .section-block { margin-top: 24px; }
    .section-title { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 14px; }
    .section-subtitle { font-size: 12px; color: #64748b; margin-top: -8px; margin-bottom: 16px; }

    .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .card-continue { flex: 0 0 calc((100% - 24px) / 3); min-width: calc((100% - 24px) / 3); scroll-snap-align: start; cursor: pointer; }
    .card-continue-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #1e293b; }
    .card-continue img { width: 100%; height: 100%; object-fit: cover; }
    .badge-ep { position: absolute; top: 8px; left: 8px; background: rgba(56, 189, 248, 0.95); color: #0f172a; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
    .close-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .close-btn svg { width: 12px; height: 12px; stroke: #ffffff; stroke-width: 2.5; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #1e293b; pointer-events: none; }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    .badge-bottom { position: absolute; bottom: 8px; left: 8px; background: rgba(15, 23, 42, 0.85); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .card-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; pointer-events: none; }

    #detailView { display: none; padding-top: 0; }
    
    .player-wrapper { margin-left: -16px; margin-right: -16px; width: calc(100% + 32px); background: #000; margin-bottom: 16px; }
    .detail-player-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
    .player-iframe { width: 100%; height: 100%; border: none; }
    
    video-player { width: 100%; height: 100%; display: block; }
    video-minimal-skin { width: 100%; height: 100%; display: block; }
    video { width: 100%; height: 100%; object-fit: contain; }

    .detail-body { padding: 0 0 16px 0; }

    /* EPISODE LIST */
    .ep-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ep-header-title { font-size: 16px; font-weight: 700; color: #fff; }
    .ep-total-text { font-size: 12px; color: #38bdf8; font-weight: 700; cursor: pointer; text-decoration: underline; }

    .ep-scroll-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; border-bottom: 1px solid #1e293b; margin-bottom: 16px; }
    .ep-scroll-grid::-webkit-scrollbar { display: none; }
    .ep-box { flex: 0 0 54px; height: 54px; background: #161f32; border: 1px solid #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #f8fafc; cursor: pointer; transition: all 0.2s; }
    .ep-box.active { background: #581c87; border-color: #a855f7; color: #ffffff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

    .action-bar { display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 11px; font-weight: 500; cursor: pointer; position: relative; }
    .action-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    .server-custom-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #38bdf8; position: relative; }
    .server-name-text { font-size: 18px; font-weight: 800; color: #38bdf8; max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; height: 22px; display: flex; align-items: center; }
    .server-label-text { font-size: 11px; font-weight: 500; color: #94a3b8; }
    .server-select-hidden { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .media-title { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 10px; }
    
    /* BADGE ROW TERMASUK RATING DI SEBELAH KIRI */
    .badge-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag-badge { background: #1e293b; color: #94a3b8; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
    .tag-rating { background: #1e293b; color: #f59e0b; font-weight: 800; font-size: 11px; padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 4px; }

    .synopsis-text { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }

    /* BOTTOM SHEET DIALOG */
    .sheet-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; backdrop-filter: blur(4px); }
    .sheet-overlay.active { display: block; }
    
    .bottom-sheet { 
      position: fixed; left: 0; right: 0; bottom: 0; 
      height: calc(100vh - (100vw * 9 / 16) - 60px); max-height: 70vh; 
      background: #0f172a; border-top-left-radius: 20px; border-top-right-radius: 20px; 
      border-top: 1px solid #334155; z-index: 201; padding: 16px; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s ease-out;
    }
    .sheet-overlay.active .bottom-sheet { transform: translateY(0); }
    
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
    .sheet-title { font-size: 16px; font-weight: 800; color: #fff; }
    .sheet-close { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; font-weight: 700; }
    
    .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 10px; overflow-y: auto; padding-bottom: 20px; }

    #statusMsg { text-align: center; margin: 40px 0; font-size: 13px; color: #64748b; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 35px; }
    .btn { background-color: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-left" onclick="openPage('/')">
        <button class="icon-btn" id="navBackBtn" style="display: none;" aria-label="Kembali">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="icon-btn" id="navMenuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="brand-title" id="topHeaderTitle">RZ Donghua</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="toggleSearch()" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
    </div>
    <div class="container">
      <div class="search-box-wrapper" id="searchWrapper">
        <input type="text" class="search-input" id="searchInput" placeholder="Cari judul..." onkeyup="handleSearch(event)">
      </div>
    </div>
  </header>

  <div class="container">

    <div id="homeView">
      <section class="section-block" id="continueSection" style="display: none;">
        <h2 class="section-title">Lanjutkan Menonton</h2>
        <div class="scroll-row" id="continueRow"></div>
      </section>

      <section class="section-block">
        <h2 class="section-title" id="sectionTitle">Rilisan Terbaru</h2>
        <p class="section-subtitle">Update Donghua Terbaru</p>

        <div id="statusMsg">Memuat data...</div>
        <div class="grid-3" id="donghuaGrid"></div>

        <div class="pagination" id="paginationNav" style="display: none;">
          <button class="btn" id="prevBtn" onclick="changePage(-1)">← Sebelumnya</button>
          <span class="page-info">Halaman <strong id="pageDisplay" style="color: #38bdf8;">1</strong></span>
          <button class="btn" id="nextBtn" onclick="changePage(1)">Selanjutnya →</button>
        </div>
      </section>
    </div>

    <div id="detailView">
      <div class="player-wrapper" id="playerWrapper" style="display: block;">
        <div class="detail-player-box" id="playerMediaContainer">Memuat video...</div>
      </div>

      <div class="detail-body">
        <div class="ep-header-row">
          <span class="ep-header-title">Episode List</span>
          <span class="ep-total-text" id="epTotalInfo" onclick="openEpisodeSheet()">0 Episode ➔</span>
        </div>
        <div class="ep-scroll-grid" id="epGrid">Memuat episode...</div>

        <div class="action-bar">
          <div class="server-custom-btn">
            <span class="server-name-text" id="serverDisplayTitle">Server</span>
            <span class="server-label-text">Server</span>
            <select class="server-select-hidden" id="serverSelect" onchange="switchServer(this.value, this.options[this.selectedIndex].text)"></select>
          </div>
          <div class="action-item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <span>Favorit</span>
          </div>
          <div class="action-item">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>Ingati saya</span>
          </div>
          <div class="action-item">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Unduh</span>
          </div>
          <div class="action-item">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>Bagikan</span>
          </div>
        </div>

        <h1 class="media-title" id="dTitle">Memuat Judul...</h1>

        <!-- RATING BERADA DI SEBELAH KIRI TOTAL EPISODE -->
        <div class="badge-row">
          <span class="tag-rating">★ 9.5</span>
          <span class="tag-badge" id="dTotalEp">Total Episode</span>
          <span class="tag-badge">2026</span>
          <span class="tag-badge">Donghua</span>
        </div>

        <p class="synopsis-text" id="dSynopsis">Memuat sinopsis...</p>

      </div>
    </div>

  </div>

  <!-- BOTTOM SHEET DIALOG -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeEpisodeSheet()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <span class="sheet-title">Semua Episode</span>
        <button class="sheet-close" onclick="closeEpisodeSheet()">✕</button>
      </div>
      <div class="sheet-grid" id="sheetEpGrid"></div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    let rawDonghuaData = [];
    let currentMainSlug = '';
    let globalEpisodes = [];

    function toggleSearch() {
      document.getElementById('searchWrapper').classList.toggle('active');
    }

    function handleSearch(event) {
      const query = event.target.value.toLowerCase().trim();
      if (query === '') { renderList(rawDonghuaData); return; }
      const filtered = rawDonghuaData.filter(item => item.title.toLowerCase().includes(query));
      renderList(filtered);
    }

    function openPage(path) {
      const cleanPath = path.startsWith('/') ? path : '/' + path;
      window.history.pushState({}, '', cleanPath);
      router();
    }

    window.onload = router;
    window.onpopstate = router;

    function router() {
      const path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
      const urlParams = new URLSearchParams(window.location.search);
      const page = parseInt(urlParams.get('page')) || 1;

      const navBackBtn = document.getElementById('navBackBtn');
      const navMenuBtn = document.getElementById('navMenuBtn');
      const topTitle = document.getElementById('topHeaderTitle');

      if (path === '' || window.location.search.includes('page')) {
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        
        navBackBtn.style.display = 'none';
        navMenuBtn.style.display = 'flex';
        topTitle.innerText = "RZ Donghua";

        renderContinueWatching();
        loadData(page);
      } else {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';

        navBackBtn.style.display = 'flex';
        navMenuBtn.style.display = 'none';

        loadDetail(path);
      }
    }

    async function loadData(page) {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('donghuaGrid');
      const paginationNav = document.getElementById('paginationNav');
      
      status.style.display = 'block';
      grid.innerHTML = '';
      paginationNav.style.display = 'none';

      try {
        const res = await fetch(`/api/donghua?page=${page}`);
        const result = await res.json();

        if (result.success) {
          status.style.display = 'none';
          document.getElementById('pageDisplay').innerText = page;
          document.getElementById('prevBtn').style.display = page <= 1 ? 'none' : 'inline-block';

          rawDonghuaData = result.data;
          renderList(rawDonghuaData);
          paginationNav.style.display = 'flex';
        }
      } catch (err) {
        status.innerText = 'Gagal memuat data.';
      }
    }

    function renderList(list) {
      const grid = document.getElementById('donghuaGrid');
      grid.innerHTML = '';
      
      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-grid';
        card.onclick = function() {
          openPage(item.slug);
        };

        card.innerHTML = `
          <div class="card-grid-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-bottom">${item.episode}</span>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadDetail(slug) {
      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = 'Memuat video...';
      document.getElementById('dTitle').innerText = 'Memuat Judul...';
      document.getElementById('dSynopsis').innerText = 'Sedang mengambil deskripsi...';
      document.getElementById('epGrid').innerHTML = 'Memuat list episode...';

      try {
        const res = await fetch(`/api/detail?slug=${slug}`);
        const result = await res.json();

        if (result.success && result.data) {
          const data = result.data;

          document.getElementById('dTitle').innerText = data.title;
          document.getElementById('topHeaderTitle').innerText = data.title;
          document.getElementById('dSynopsis').innerText = data.synopsis;

          const epGrid = document.getElementById('epGrid');
          epGrid.innerHTML = '';

          if (data.episodes && data.episodes.length > 0) {
            globalEpisodes = data.episodes;
            document.getElementById('dTotalEp').innerText = `Total ${data.episodes.length} Episode`;
            document.getElementById('epTotalInfo').innerText = `${data.episodes.length} Episode ➔`;

            currentMainSlug = slug;
            const epOne = data.episodes[data.episodes.length - 1]; // Episode 1

            // Cek Riwayat
            const savedHistory = getSavedEpisode(slug);
            let targetEpSlug = savedHistory ? savedHistory.epSlug : (epOne ? epOne.slug : data.episodes[0].slug);

            // Render horizontal scroll list
            data.episodes.forEach((ep, index) => {
              const box = document.createElement('div');
              box.className = 'ep-box';
              box.id = `ep-box-${ep.slug}`;
              const epNumber = ep.title.match(/\d+/) ? ep.title.match(/\d+/)[0] : (index + 1);
              box.innerText = epNumber;

              box.onclick = () => {
                selectEpisode(currentMainSlug, ep.slug, data.title, data.poster, `Ep ${epNumber}`);
              };
              epGrid.appendChild(box);
            });

            // Highlight episode aktif
            document.querySelectorAll('.ep-box').forEach(el => el.classList.remove('active'));
            const activeBox = document.getElementById(`ep-box-${targetEpSlug}`);
            if (activeBox) activeBox.classList.add('active');

            // Ambil video stream
            if (data.servers && data.servers.length > 0) {
              setupServers(data.servers, data.streamUrl);
              const epNum = targetEpSlug.match(/\d+/) ? targetEpSlug.match(/\d+/)[0] : '1';
              saveHistory(currentMainSlug, targetEpSlug, data.title, data.poster, `Ep ${epNum}`);
            } else {
              fetchAndPlayStream(targetEpSlug, currentMainSlug, data.title, data.poster);
            }

          } else {
            epGrid.innerText = 'Tidak ada episode.';
            setupServers(data.servers, data.streamUrl);
          }
        } else {
          document.getElementById('dTitle').innerText = 'Gagal memuat detail.';
        }
      } catch (err) {
        document.getElementById('dTitle').innerText = 'Gagal memuat detail.';
      }
    }

    async function selectEpisode(mainSlug, epSlug, title, poster, episodeName) {
      closeEpisodeSheet();
      document.querySelectorAll('.ep-box').forEach(el => el.classList.remove('active'));
      const targetBox = document.getElementById(`ep-box-${epSlug}`);
      if (targetBox) targetBox.classList.add('active');

      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = 'Memuat video...';

      document.getElementById('serverSelect').innerHTML = '';
      document.getElementById('serverDisplayTitle').innerText = 'Server';

      saveHistory(mainSlug, epSlug, title, poster, episodeName);
      await fetchAndPlayStream(epSlug, mainSlug, title, poster);
    }

    async function fetchAndPlayStream(epSlug, mainSlug, title, poster) {
      try {
        const res = await fetch(`/api/detail?slug=${epSlug}`);
        const result = await res.json();

        if (result.success && result.data && result.data.servers && result.data.servers.length > 0) {
          setupServers(result.data.servers, result.data.streamUrl);
          const epNum = epSlug.match(/\d+/) ? epSlug.match(/\d+/)[0] : '1';
          saveHistory(mainSlug, epSlug, title, poster, `Ep ${epNum}`);
        } else {
          document.getElementById('playerMediaContainer').innerText = 'Server video episode ini belum tersedia.';
        }
      } catch (e) {
        document.getElementById('playerMediaContainer').innerText = 'Gagal memuat video.';
      }
    }

    function setupServers(servers, fallbackUrl) {
      const serverSelect = document.getElementById('serverSelect');
      const serverDisplayTitle = document.getElementById('serverDisplayTitle');

      serverSelect.innerHTML = '';
      if (servers && servers.length > 0) {
        servers.forEach((srv) => {
          const opt = document.createElement('option');
          opt.value = srv.url;
          opt.innerText = srv.name;
          serverSelect.appendChild(opt);
        });

        serverSelect.selectedIndex = 0;
        serverDisplayTitle.innerText = servers[0].name;
        renderPlayerMedia(servers[0].url);
      } else if (fallbackUrl) {
        renderPlayerMedia(fallbackUrl);
      } else {
        document.getElementById('playerMediaContainer').innerText = 'Server video tidak tersedia.';
      }
    }

    function renderPlayerMedia(url) {
      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = '';

      if (!url) return;

      const isDirectMedia = url.includes('.mp4') || url.includes('.m3u8');

      if (isDirectMedia) {
        mediaBox.innerHTML = `
          <video-player>
            <video-minimal-skin>
              <video id="myVideo" src="${url}" playsinline controls autoplay crossorigin="anonymous"></video>
            </video-minimal-skin>
          </video-player>
        `;

        const video = document.getElementById('myVideo');
        if (url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
        }
      } else {
        const proxyUrl = `/api/player?url=${encodeURIComponent(url)}`;

        mediaBox.innerHTML = `
          <iframe 
            class="player-iframe" 
            src="${proxyUrl}" 
            allowfullscreen>
          </iframe>
        `;
      }
    }

    function switchServer(url, name) {
      if (url) {
        document.getElementById('serverDisplayTitle').innerText = name || 'Server';
        renderPlayerMedia(url);
      }
    }

    function openEpisodeSheet() {
      const sheetGrid = document.getElementById('sheetEpGrid');
      const overlay = document.getElementById('sheetOverlay');
      sheetGrid.innerHTML = '';

      if (globalEpisodes.length === 0) return;

      globalEpisodes.forEach((ep, index) => {
        const box = document.createElement('div');
        box.className = 'ep-box';
        const epNumber = ep.title.match(/\d+/) ? ep.title.match(/\d+/)[0] : (index + 1);
        box.innerText = epNumber;

        box.onclick = () => {
          selectEpisode(currentMainSlug, ep.slug, document.getElementById('dTitle').innerText, '', `Ep ${epNumber}`);
        };
        sheetGrid.appendChild(box);
      });

      overlay.classList.add('active');
    }

    function closeEpisodeSheet() {
      document.getElementById('sheetOverlay').classList.remove('active');
    }

    function saveHistory(mainSlug, epSlug, title, poster, episode) {
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      history = history.filter(item => item.mainSlug !== mainSlug);
      
      history.unshift({ mainSlug, epSlug, title, poster, episode });
      localStorage.setItem('rz_continue_history', JSON.stringify(history.slice(0, 20)));
    }

    function getSavedEpisode(mainSlug) {
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      return history.find(item => item.mainSlug === mainSlug);
    }

    function renderContinueWatching() {
      const history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');

      if (history.length === 0) { container.style.display = 'none'; return; }
      container.style.display = 'block';
      row.innerHTML = '';

      history.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-continue';

        card.onclick = function() {
          openPage(item.mainSlug);
        };

        card.innerHTML = `
          <div class="card-continue-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy" />
            <span class="badge-ep">${item.episode || 'Lanjut'}</span>
            <button class="close-btn" onclick="event.stopPropagation(); removeHistory(${index})"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        row.appendChild(card);
      });
    }

    function removeHistory(index) {
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      history.splice(index, 1);
      localStorage.setItem('rz_continue_history', JSON.stringify(history));
      renderContinueWatching();
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      openPage('?page=' + currentPage);
    }
  </script>
</body>
</html>
