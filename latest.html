<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tabTitle">Donghua Terbaru - RZSTREAM</title>

  <style>
    :root {
      --bg-main: #030712;
      --blue-accent: #0284c7;
      --cyan-bright: #38bdf8;
      --card-bg: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-top: 75px;
      padding-bottom: 40px; 
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      padding: 10px 16px; 
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    }
    
    .header-content { 
      max-width: 1000px; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
      height: 48px; 
    }
    
    .brand-title { font-size: 20px; font-weight: 900; color: var(--cyan-bright); text-decoration: none; }
    .page-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--cyan-bright); }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: var(--card-bg); border: 1px solid rgba(56, 189, 248, 0.15); }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { position: absolute; top: 8px; left: 8px; background: rgba(2, 132, 199, 0.95); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
    .badge-bottom { position: absolute; bottom: 8px; left: 8px; max-width: calc(100% - 16px); background: rgba(15, 23, 42, 0.85); color: var(--cyan-bright); border: 1px solid rgba(56, 189, 248, 0.2); font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .load-more-btn { display: block; width: 100%; margin-top: 24px; padding: 14px; background: var(--card-bg); color: var(--cyan-bright); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; text-align: center; }
    .back-btn { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.2); color: var(--cyan-bright); padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="/" class="brand-title" id="displayBrandTitle">RZSTREAM</a>
      <a href="/" class="back-btn">✕ Kembali</a>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">🔥 Donghua Terbaru</h1>
    <div class="grid-3" id="latestGrid"></div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreData()">Muat Lainnya</button>
  </div>

  <script>
    let page = 1;

    async function applySettings() {
      try {
        const res = await fetch('/api/settings').then(r => r.json());
        if (res.success && res.settings) {
          document.getElementById('displayBrandTitle').innerText = res.settings.brandTitle;
          document.title = `Donghua Terbaru - ${res.settings.brandTitle}`;
        }
      } catch (e) {}
    }

    function cleanPath(input) {
      if (!input) return '';
      return String(input).replace(/^https?:\/\/[^\/]+/, '').replace(/^\/detail\//, '').replace(/^\/anime\//, '').replace(/^\/+|\/+$/g, '');
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card-grid';
      card.onclick = () => window.location.href = `/detail/${cleanPath(item.slug)}`;

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <span class="badge-ep">${item.status || 'Ongoing'}</span>
          <span class="badge-bottom">${item.episode || 'Ep 1'}</span>
        </div>
        <div class="card-title">${item.title}</div>
      `;
      return card;
    }

    async function loadMoreData() {
      const btn = document.getElementById('loadMoreBtn');
      btn.innerText = 'Memuat...';

      try {
        const res = await fetch(`/api/donghua?type=latest&page=${page}`).then(r => r.json());
        if (res.success && res.data && res.data.length > 0) {
          const grid = document.getElementById('latestGrid');
          res.data.forEach(item => grid.appendChild(createCard(item)));
          page++;
          btn.innerText = 'Muat Lainnya';
        } else {
          btn.innerText = 'Tidak ada data lagi';
        }
      } catch (e) {
        btn.innerText = 'Gagal memuat data';
      }
    }

    window.onload = () => {
      applySettings();
      loadMoreData();
    };
  </script>
</body>
</html>
