<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Donghua Terbaru</title>
  
  <!-- Panggil Style & Engine dari folder /assets/ -->
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme.js" defer></script>

  <style>
    body { padding-top: 75px; }
    .page-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--color-accent); }
    .load-more-btn { display: block; width: 100%; margin-top: 24px; padding: 14px; background: var(--bg-card); color: var(--color-accent); border: 1px solid var(--border-color); border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; text-align: center; transition: background 0.2s, border-color 0.2s; }
    .load-more-btn:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--color-accent); }
  </style>
</head>
<body>

  <!-- Komponen Header & Search dirender otomatis oleh /assets/theme.js -->
  <div id="app-header"></div>
  <div id="app-search"></div>

  <div class="container">
    <h1 class="page-title">🔥 Donghua Terbaru</h1>
    <div class="grid-3" id="latestGrid"></div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreData()">Muat Lainnya</button>
  </div>

  <!-- Komponen Footer dirender otomatis oleh /assets/theme.js -->
  <div id="app-footer"></div>

  <script>
    let page = 1;

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card-grid';
      card.onclick = () => window.location.href = `/detail/${RZTheme.cleanPath(item.slug)}`;
      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <span class="badge-ep">${item.status || 'Ongoing'}</span>
          <span class="badge-bottom">${item.episode || 'Ep 1'}</span>
        </div>
        <div class="card-title">${item.title}</div>
      `;
      return card;
    }

    async function loadMoreData() {
      const btn = document.getElementById('loadMoreBtn');
      btn.innerText = 'Memuat...';

      try {
        const res = await fetch(`/api/donghua?type=latest&page=${page}`).then(r => r.json());
        if (res.success && res.data && res.data.length > 0) {
          const grid = document.getElementById('latestGrid');
          res.data.forEach(item => grid.appendChild(createCard(item)));
          page++;
          btn.innerText = 'Muat Lainnya';
        } else {
          btn.innerText = 'Tidak ada data lagi';
        }
      } catch (e) {
        btn.innerText = 'Gagal memuat data';
      }
    }

    window.onload = () => {
      loadMoreData();
    };
  </script>
</body>
</html>
