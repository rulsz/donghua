<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Donghua Terbaru - RZSTREAM</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: #000000; 
      color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-top: 80px;
      padding-bottom: 40px; 
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      padding: 10px 16px; 
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .header-content { 
      max-width: 1000px; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
      height: 48px; 
    }
    
    .header-left-group { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 20px; font-weight: 900; color: #e11d48; text-decoration: none; }
    .page-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: #38bdf8; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; }
    .card-grid-img-wrapper { position: relative; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #111827; }
    .card-grid img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { position: absolute; top: 8px; left: 8px; background: rgba(56, 189, 248, 0.95); color: #0f172a; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
    .badge-bottom { position: absolute; bottom: 8px; left: 8px; max-width: calc(100% - 16px); background: rgba(18, 24, 38, 0.85); color: #38bdf8; border: 1px solid rgba(255, 255, 255, 0.18); font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .load-more-btn { display: block; width: 100%; margin-top: 24px; padding: 14px; background: #111827; color: #38bdf8; border: 1px solid #1e293b; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; text-align: center; }
    .back-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-left-group">
        <a href="/" class="brand-title">RZSTREAM</a>
      </div>
      <button class="back-btn" onclick="window.location.href='/'">✕ Kembali</button>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Semua Donghua Terbaru</h1>
    <div class="grid-3" id="latestGrid"></div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreData()">Muat Lainnya</button>
  </div>

  <script>
    let page = 1;

    function cleanPath(input) {
      if (!input) return '';
      return String(input).replace(/^https?:\/\/[^\/]+/, '').replace(/^\/detail\//, '').replace(/^\/anime\//, '').replace(/^\/+|\/+$/g, '');
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card-grid';
      card.onclick = () => window.location.href = `/detail/${cleanPath(item.slug)}`;

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${item.poster}" alt="${item.title}" loading="lazy" />
          <span class="badge-ep">${item.status || 'Ongoing'}</span>
          <span class="badge-bottom">${item.episode || 'Ep 1'}</span>
        </div>
        <div class="card-title">${item.title}</div>
      `;
      return card;
    }

    async function loadMoreData() {
      const btn = document.getElementById('loadMoreBtn');
      btn.innerText = 'Memuat...';

      try {
        const res = await fetch(`/api/donghua?type=latest&page=${page}`).then(r => r.json());
        if (res.success && res.data && res.data.length > 0) {
          const grid = document.getElementById('latestGrid');
          res.data.forEach(item => grid.appendChild(createCard(item)));
          page++;
          btn.innerText = 'Muat Lainnya';
        } else {
          btn.innerText = 'Tidak ada data lagi';
        }
      } catch (e) {
        btn.innerText = 'Gagal memuat data';
      }
    }

    window.onload = () => {
      loadMoreData();
    };
  </script>
</body>
</html>
