<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profil Saya - RZSTREAM</title>

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-search-input: #121212;
      --color-primary: #0284c7;
      --color-accent: #38bdf8;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-top: 68px; padding-bottom: 40px; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }

    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); padding: 10px 16px; }
    .header-content { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 44px; }
    .header-title { font-size: 18px; font-weight: 800; color: var(--color-accent); }
    .back-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
    .back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
    .avatar-large { width: 80px; height: 80px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; margin: 0 auto 12px auto; overflow: hidden; border: 2px solid var(--color-accent); }
    .avatar-large img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: 18px; font-weight: 800; color: #fff; }
    .user-email { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .section-title { font-size: 15px; font-weight: 700; color: var(--color-accent); margin: 24px 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .section-title svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input { width: 100%; height: 42px; background: var(--bg-search-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 0 12px; color: #fff; font-size: 14px; outline: none; }
    
    .btn-save { width: 100%; height: 42px; background: var(--color-primary); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-logout { width: 100%; height: 42px; background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 20px; }

    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-card { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; cursor: pointer; }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-thumb { width: 50px; height: 65px; border-radius: 8px; object-fit: cover; background: #222; }
    .item-title { font-size: 13px; font-weight: 700; color: #fff; }
    .item-sub { font-size: 11px; color: var(--color-accent); margin-top: 2px; }
    .btn-del-item { background: none; border: none; color: #ef4444; padding: 8px; cursor: pointer; }
    .btn-del-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="/" class="back-btn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="header-title">Profil Saya</span>
      <div style="width: 36px;"></div>
    </div>
  </header>

  <div class="container">
    <div class="profile-card">
      <div class="avatar-large" id="avatarDisplay">U</div>
      <div class="user-name" id="userNameDisplay">Memuat...</div>
      <div class="user-email" id="userEmailDisplay">...</div>
    </div>

    <!-- Edit Profil -->
    <div class="section-title">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Edit Informasi Profil
    </div>
    <form onsubmit="handleUpdateProfile(event)">
      <div class="form-group">
        <label>Nama Tampilan</label>
        <input type="text" id="inputDisplayName" placeholder="Masukkan nama kamu" required>
      </div>
      <div class="form-group">
        <label>URL Foto Profil (Opsional)</label>
        <input type="url" id="inputPhotoURL" placeholder="https://example.com/avatar.jpg">
      </div>
      <button type="submit" class="btn-save">Simpan Perubahan Profil</button>
    </form>

    <!-- Ubah Password -->
    <div class="section-title">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Ubah Kata Sandi
    </div>
    <form onsubmit="handleUpdatePassword(event)">
      <div class="form-group">
        <label>Kata Sandi Baru</label>
        <input type="password" id="inputNewPassword" placeholder="Minimum 6 karakter" required minlength="6">
      </div>
      <button type="submit" class="btn-save">Perbarui Kata Sandi</button>
    </form>

    <!-- Daftar Favorit -->
    <div class="section-title" id="favoritesSection">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Donghua Favorit Saya
    </div>
    <div class="item-list" id="userFavoritesContainer">
      <p style="font-size: 12px; color: var(--text-muted);">Memuat favorit...</p>
    </div>

    <!-- Riwayat Menonton -->
    <div class="section-title">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Riwayat Menonton Saya
    </div>
    <div class="item-list" id="userHistoryContainer">
      <p style="font-size: 12px; color: var(--text-muted);">Memuat riwayat...</p>
    </div>

    <button class="btn-logout" onclick="handleLogout()">Keluar dari Akun</button>
  </div>

  <script>
    function checkAuthAndLoadData() {
      if (!window.currentUser) {
        setTimeout(() => {
          if (!window.currentUser) window.location.href = '/';
          else fillUserData();
        }, 1000);
      } else {
        fillUserData();
      }
    }

    function fillUserData() {
      const user = window.currentUser;
      if (!user) return;

      const name = user.displayName || user.email.split('@')[0];
      document.getElementById('userNameDisplay').innerText = name;
      document.getElementById('userEmailDisplay').innerText = user.email;
      document.getElementById('inputDisplayName').value = user.displayName || '';
      document.getElementById('inputPhotoURL').value = user.photoURL || '';

      const avatarBox = document.getElementById('avatarDisplay');
      if (user.photoURL) {
        avatarBox.innerHTML = `<img src="${user.photoURL}" alt="${name}" />`;
      } else {
        avatarBox.innerText = name.charAt(0).toUpperCase();
      }

      loadUserFavorites();
      loadUserHistory();
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const newName = document.getElementById('inputDisplayName').value.trim();
      const newPhoto = document.getElementById('inputPhotoURL').value.trim();

      try {
        await window.fbUpdateProfile(window.currentUser, {
          displayName: newName,
          photoURL: newPhoto
        });
        alert("Profil berhasil diperbarui!");
        fillUserData();
      } catch (err) {
        alert("Gagal memperbarui profil: " + err.message);
      }
    }

    async function handleUpdatePassword(e) {
      e.preventDefault();
      const newPass = document.getElementById('inputNewPassword').value;

      try {
        await window.fbUpdatePassword(window.currentUser, newPass);
        alert("Kata sandi berhasil diubah!");
        document.getElementById('inputNewPassword').value = '';
      } catch (err) {
        alert("Gagal mengubah kata sandi: " + err.message);
      }
    }

    async function loadUserFavorites() {
      const container = document.getElementById('userFavoritesContainer');
      let favList = [];

      if (window.currentUser && window.db) {
        try {
          const snap = await window.fbGet(window.fbRef(window.db, `users/${window.currentUser.uid}/favorites`));
          if (snap.exists()) favList = Object.values(snap.val());
        } catch (e) {}
      } else {
        favList = JSON.parse(localStorage.getItem('rz_favorites') || '[]');
      }

      if (favList.length > 0) {
        container.innerHTML = '';
        favList.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div class="item-left" onclick="window.location.href='/detail/${item.slug}'">
              <img class="item-thumb" src="${item.poster || 'https://via.placeholder.com/50x65'}" />
              <div>
                <div class="item-title">${item.title}</div>
                <div class="item-sub">Tonton Sekarang</div>
              </div>
            </div>
            <button class="btn-del-item" onclick="deleteFavoriteItem('${item.slug}')">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = '<p style="font-size: 12px; color: var(--text-muted);">Belum ada donghua favorit.</p>';
      }
    }

    async function deleteFavoriteItem(slug) {
      if (window.currentUser && window.db) {
        const favRef = window.fbRef(window.db, `users/${window.currentUser.uid}/favorites/${slug}`);
        await window.fbRemove(favRef);
      } else {
        let favs = JSON.parse(localStorage.getItem('rz_favorites') || '[]');
        favs = favs.filter(f => f.slug !== slug);
        localStorage.setItem('rz_favorites', JSON.stringify(favs));
      }
      loadUserFavorites();
    }

    async function loadUserHistory() {
      const container = document.getElementById('userHistoryContainer');
      let historyList = [];

      if (window.currentUser && window.db) {
        try {
          const snap = await window.fbGet(window.fbRef(window.db, `users/${window.currentUser.uid}/history`));
          if (snap.exists()) historyList = Object.values(snap.val());
        } catch (e) {}
      } else {
        historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      }

      if (historyList.length > 0) {
        container.innerHTML = '';
        historyList.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div class="item-left" onclick="window.location.href='/detail/${item.mainPath}'">
              <img class="item-thumb" src="${item.poster || 'https://via.placeholder.com/50x65'}" />
              <div>
                <div class="item-title">${item.title}</div>
                <div class="item-sub">${item.episode || 'Lanjut'}</div>
              </div>
            </div>
            <button class="btn-del-item" onclick="deleteHistoryItem('${item.mainPath}')">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = '<p style="font-size: 12px; color: var(--text-muted);">Belum ada riwayat menonton.</p>';
      }
    }

    async function deleteHistoryItem(slug) {
      if (window.currentUser && window.db) {
        const histRef = window.fbRef(window.db, `users/${window.currentUser.uid}/history/${slug}`);
        await window.fbRemove(histRef);
      } else {
        let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
        history = history.filter(i => i.mainPath !== slug);
        localStorage.setItem('rz_continue_history', JSON.stringify(history));
      }
      loadUserHistory();
    }

    async function handleLogout() {
      if (confirm("Apakah Anda yakin ingin keluar?")) {
        await window.fbSignOut(window.auth);
        window.location.href = '/';
      }
    }

    window.onload = checkAuthAndLoadData;
  </script>
</body>
</html>
