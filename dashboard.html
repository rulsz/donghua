<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - RZSTREAM</title>
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(56, 189, 248, 0.2);
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header Navigation Mobile */
    .top-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand { font-size: 18px; font-weight: 900; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; }
    .btn-back { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; }

    .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
    .page-header { margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 800; color: #fff; }
    .page-desc { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

    /* Card Form Responsive */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .form-card-title { font-size: 15px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 14px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    
    .form-input {
      width: 100%; padding: 12px 14px;
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 10px; color: #fff; font-size: 14px; outline: none;
    }
    .form-input:focus { border-color: var(--accent-cyan); }

    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff; border: none; border-radius: 12px;
      font-weight: 800; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent-blue); color: #fff; padding: 12px 24px;
      border-radius: 25px; font-weight: 700; font-size: 13px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6); display: none; z-index: 999;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">⚡ DASHBOARD</div>
    <a href="/" class="btn-back">🌐 Ke Beranda</a>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">Pengaturan Situs Global</h1>
      <p class="page-desc">Perubahan di sini akan langsung berdampak pada semua pengunjung di semua HP/Perangkat.</p>
    </div>

    <form id="settingsForm" onsubmit="saveSettings(event)">
      <div class="form-card">
        <h2 class="form-card-title">Identitas Visual Website</h2>
        <div class="form-group">
          <label class="form-label">Nama Brand Logo (Header)</label>
          <input type="text" id="brandTitleInput" class="form-input" required placeholder="Contoh: RZSTREAM">
        </div>
        <div class="form-group">
          <label class="form-label">Judul Tab Browser (HTML Title)</label>
          <input type="text" id="pageTitleInput" class="form-input" required placeholder="Contoh: RZSTREAM - Streaming Donghua Sub Indo">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Simpan Secara Global</button>
    </form>
  </main>

  <div class="toast" id="toast">✅ Perubahan Disimpan Secara Global!</div>

  <script>
    async function fetchSettings() {
      try {
        const res = await fetch('/api/settings').then(r => r.json());
        if (res.success && res.settings) {
          document.getElementById('brandTitleInput').value = res.settings.brandTitle || 'RZSTREAM';
          document.getElementById('pageTitleInput').value = res.settings.pageTitle || 'RZSTREAM - Streaming Donghua Sub Indo';
        }
      } catch (e) {
        console.error('Gagal mengambil settings:', e);
      }
    }

    async function saveSettings(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = 'Saving...';

      const payload = {
        brandTitle: document.getElementById('brandTitleInput').value.trim(),
        pageTitle: document.getElementById('pageTitleInput').value.trim()
      };

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (res.success) {
          localStorage.setItem('rz_brand_title', payload.brandTitle);
          localStorage.setItem('rz_page_title', payload.pageTitle);
          
          const toast = document.getElementById('toast');
          toast.style.display = 'block';
          setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
      } catch (err) {
        alert('Gagal menyimpan perubahan ke server.');
      } finally {
        btn.innerText = 'Simpan Secara Global';
      }
    }

    window.onload = fetchSettings;
  </script>
</body>
</html>
