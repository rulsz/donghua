<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">RZ Media Player - Detail</title>

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body { background-color: #000000; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-top: 68px; padding-bottom: 40px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
    
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 70%, rgba(0, 0, 0, 0) 100%); padding: 10px 16px 16px 16px; }
    .header-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 44px; }
    .header-left-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .icon-circle-btn { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); color: #ffffff; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.15); }
    .icon-circle-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .brand-title { font-size: 17px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    
    /* Skeleton Animation */
    @keyframes skeletonPulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    .skeleton { background: #182232; animation: skeletonPulse 1.5s infinite ease-in-out; border-radius: 8px; }
    .skeleton-player { width: 100%; height: 100%; border-radius: 0; }
    .skeleton-title { height: 24px; width: 65%; margin-bottom: 12px; }
    .skeleton-synopsis { height: 12px; width: 100%; margin-bottom: 6px; }

    .player-wrapper { margin-left: -16px; margin-right: -16px; width: calc(100% + 32px); background: #000; margin-bottom: 16px; position: relative; aspect-ratio: 16/9; }
    .detail-player-box { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
    .player-iframe { width: 100%; height: 100%; border: none; }
    
    /* EP Header & Tombol Lihat Semua Episode Modern */
    .ep-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .ep-header-title { font-size: 16px; font-weight: 800; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
    
    .btn-see-all-ep {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(56, 189, 248, 0.12); color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-see-all-ep:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .btn-see-all-ep svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; }

    .ep-scroll-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 16px; scrollbar-width: none; }
    .ep-scroll-grid::-webkit-scrollbar { display: none; }
    .ep-box { flex: 0 0 54px; height: 54px; background: #111827; border: 1px solid #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .ep-box.active { background: #0284c7; border-color: #38bdf8; color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
    
    /* Action Bar */
    .action-bar { display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; position: relative; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 11px; cursor: pointer; background: none; border: none; outline: none; }
    .action-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .action-item.active { color: #38bdf8; }
    .action-item.active svg { fill: #38bdf8; stroke: #38bdf8; }
    
    .server-custom-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #94a3b8; position: relative; }
    .server-custom-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .server-label-text { font-size: 11px; font-weight: 500; color: #94a3b8; }
    .server-select-hidden { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    /* Tooltip Server */
    .server-tooltip-hint {
      position: absolute; top: -45px; left: 10px;
      background: #0284c7; color: #ffffff;
      padding: 6px 12px; border-radius: 8px;
      font-size: 11px; font-weight: 700;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
      z-index: 50; display: flex; align-items: center; gap: 6px;
      opacity: 0; transform: translateY(8px);
      transition: all 0.4s ease; pointer-events: none;
    }
    .server-tooltip-hint.show { opacity: 1; transform: translateY(0); }
    .server-tooltip-hint::after {
      content: ''; position: absolute; bottom: -6px; left: 24px;
      border-width: 6px 6px 0; border-style: solid;
      border-color: #0284c7 transparent transparent transparent;
    }

    .media-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .synopsis-text { font-size: 13px; line-height: 1.5; color: #94a3b8; margin-bottom: 24px; }
    
    .sheet-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; backdrop-filter: blur(4px); }
    .sheet-overlay.active { display: block; }
    .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; max-height: 70vh; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 201; padding: 16px; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease-out; background: #0f172a; }
    .sheet-overlay.active .bottom-sheet { transform: translateY(0); }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
    .sheet-title { font-size: 16px; font-weight: 800; }
    .sheet-close { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; font-weight: 700; }
    .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 10px; overflow-y: auto; padding-bottom: 20px; }

    /* =========================================================
       UI KOMENTAR TIKTOK STYLE 
       ========================================================= */
    .comments-section { margin-top: 30px; border-top: 1px solid #1e293b; padding-top: 20px; }
    .comments-header { font-size: 16px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: #f8fafc; }
    
    /* Input Komentar TikTok Style */
    .comment-input-box {
      display: flex; align-items: center; gap: 10px;
      background: #121722; border: 1px solid #222e42;
      border-radius: 24px; padding: 6px 8px 6px 14px;
      margin-bottom: 24px; transition: border-color 0.2s;
    }
    .comment-input-box:focus-within { border-color: #38bdf8; }
    .comment-textarea {
      flex: 1; height: 36px; background: transparent; border: none;
      color: #fff; font-size: 13px; outline: none; resize: none;
      font-family: inherit; line-height: 36px;
    }
    .btn-send-comment {
      background: #0284c7; color: #fff; border: none;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: transform 0.2s;
    }
    .btn-send-comment:active { transform: scale(0.9); }
    .btn-send-comment svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    
    .comment-login-notice { background: rgba(15, 23, 42, 0.6); border: 1px dashed rgba(56, 189, 248, 0.3); border-radius: 14px; padding: 16px; text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .comment-login-notice a { color: #38bdf8; font-weight: 700; text-decoration: none; cursor: pointer; }

    /* List Komentar TikTok */
    .comments-list { display: flex; flex-direction: column; gap: 18px; }
    .comment-card { display: flex; gap: 12px; position: relative; }
    
    .tiktok-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #0284c7; color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; overflow: hidden;
      flex-shrink: 0;
    }
    .tiktok-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .comment-content { flex: 1; }
    .comment-user-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .tiktok-username { font-size: 12.5px; font-weight: 700; color: #94a3b8; }
    .tiktok-username.admin { color: #f59e0b !important; }
    
    .badge-admin {
      background: #f59e0b; color: #000; font-size: 9px; font-weight: 900;
      padding: 1px 5px; border-radius: 3px; letter-spacing: 0.3px;
    }

    .comment-body-text { font-size: 13.5px; color: #f1f5f9; line-height: 1.4; word-break: break-word; }
    
    .comment-footer-actions { display: flex; align-items: center; gap: 16px; margin-top: 6px; font-size: 12px; color: #64748b; }
    .comment-time { font-size: 11px; }
    .btn-reply-tiktok { font-weight: 700; color: #94a3b8; cursor: pointer; background: none; border: none; padding: 0; font-size: 12px; }
    .btn-reply-tiktok:hover { color: #fff; }
    .btn-delete-tiktok { font-weight: 700; color: #ef4444; cursor: pointer; background: none; border: none; padding: 0; font-size: 12px; }

    /* Tombol Like TikTok Samping Kanan */
    .comment-like-box { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4px; gap: 2px; color: #64748b; font-size: 11px; cursor: pointer; }
    .comment-like-box svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; transition: all 0.2s; }
    .comment-like-box.liked svg { fill: #ef4444; stroke: #ef4444; }
    .comment-like-box.liked { color: #ef4444; }

    /* Tombol "Lihat X Balasan" Ala TikTok */
    .replies-toggle-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #8b92a5; font-size: 12px; font-weight: 700;
      margin-top: 8px; cursor: pointer; background: none; border: none; padding: 0;
    }
    .replies-toggle-btn::before {
      content: ""; display: inline-block; width: 20px; height: 1px; background: #334155;
    }
    .replies-toggle-btn:hover { color: #e2e8f0; }

    /* Wrapper Balasan Tersembunyi */
    .replies-container { display: none; margin-top: 10px; flex-direction: column; gap: 14px; }
    .replies-container.show { display: flex; }

    .reply-card { display: flex; gap: 10px; }
    .reply-card .tiktok-avatar { width: 28px; height: 28px; font-size: 11px; }

    .reply-input-box { margin-top: 10px; display: flex; gap: 8px; }
    .reply-input { flex: 1; height: 34px; background: #0b1329; border: 1px solid #1e293b; border-radius: 18px; padding: 0 12px; color: #fff; font-size: 12px; outline: none; }
    .btn-reply-send { background: #0284c7; color: #fff; border: none; padding: 0 14px; border-radius: 18px; font-size: 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-left-group" onclick="goBack()">
        <button class="icon-circle-btn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <span class="brand-title" id="topHeaderTitle">Detail Video</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="player-wrapper">
      <div class="detail-player-box" id="playerMediaContainer">
        <div class="skeleton skeleton-player"></div>
      </div>
    </div>

    <div class="detail-body">
      <div id="epContainer">
        <div class="ep-header-row">
          <span class="ep-header-title">
            Episode List
          </span>
          <button class="btn-see-all-ep" onclick="openEpisodeSheet()">
            <span id="epTotalInfo">0 Episode</span>
            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="ep-scroll-grid" id="epGrid">
          <div class="ep-box skeleton"></div>
          <div class="ep-box skeleton"></div>
          <div class="ep-box skeleton"></div>
          <div class="ep-box skeleton"></div>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <div class="server-tooltip-hint" id="serverHint">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          Ganti server pemutaran di sini
        </div>

        <div class="server-custom-btn">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          <span class="server-label-text">Server</span>
          <select class="server-select-hidden" id="serverSelect" onchange="switchServer(this.value, this.options[this.selectedIndex].text)"></select>
        </div>

        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="viewCountText">0</span>
        </div>

        <button class="action-item" id="btnFavorite" onclick="toggleFavorite()">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>Favorit</span>
        </button>

        <button class="action-item" onclick="triggerDownload()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Unduh</span>
        </button>

        <button class="action-item" onclick="triggerShare()">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Bagikan</span>
        </button>
      </div>

      <div id="mediaDetailsGroup">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-synopsis"></div>
        <div class="skeleton skeleton-synopsis" style="width: 80%;"></div>
      </div>

      <!-- Section Komentar TikTok -->
      <section class="comments-section">
        <h3 class="comments-header">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Komentar
        </h3>

        <!-- Input Komentar TikTok -->
        <div class="comment-input-box" id="commentFormBox" style="display: none;">
          <input class="comment-textarea" id="commentInput" placeholder="Tambah komentar..." />
          <button class="btn-send-comment" onclick="submitComment()">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>

        <div class="comment-login-notice" id="commentLoginNotice">
          Silakan <a onclick="goToHomeLogin()">Login</a> terlebih dahulu untuk menulis komentar.
        </div>

        <div class="comments-list" id="commentsListContainer">
          <p style="font-size:12px; color:#64748b;">Memuat komentar...</p>
        </div>
      </section>
    </div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeEpisodeSheet()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <span class="sheet-title">Semua Episode</span>
        <button class="sheet-close" onclick="closeEpisodeSheet()">✕</button>
      </div>
      <div class="sheet-grid" id="sheetEpGrid"></div>
    </div>
  </div>

  <script>
    let globalEpisodes = [];
    let currentMainTitle = '';
    let currentPoster = '';
    let currentServerUrl = '';
    let isFavorite = false;

    const ADMIN_EMAIL = 'zahrulms01@gmail.com';

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function cleanSlug(str) {
      const urlParams = new URLSearchParams(window.location.search);
      let paramSlug = urlParams.get('slug');
      if (paramSlug) str = paramSlug;
      if (!str) str = window.location.pathname;
      return String(str)
        .replace(/^https?:\/\/[^\/]+/, '')
        .replace(/^\/?detail\//, '')
        .replace(/^\/?anime\//, '')
        .replace(/^\/?movie\//, '')
        .replace(/^\/+|\/+$/g, '');
    }

    function getEpNumber(title, fallback) {
      const match = title ? title.match(/\d+/) : null;
      return match ? parseInt(match[0]) : fallback;
    }

    function formatViews(num) {
      if (!num || isNaN(num)) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    let targetSlug = cleanSlug();

    function goBack() { window.location.href = '/'; }
    function goToHomeLogin() { window.location.href = '/'; }

    function showServerHint() {
      const hint = document.getElementById('serverHint');
      if (!hint) return;
      hint.classList.add('show');
      setTimeout(() => {
        hint.classList.remove('show');
      }, 4000);
    }

    async function initViewsAndComments() {
      if (!targetSlug) return;

      if (window.db) {
        const today = getTodayString();
        try {
          const totalRef = window.fbRef(window.db, `views_total/${targetSlug}`);
          await window.fbTransaction(totalRef, (current) => (current || 0) + 1);

          const dailyRef = window.fbRef(window.db, `views_daily/${today}/${targetSlug}`);
          await window.fbTransaction(dailyRef, (current) => (current || 0) + 1);

          const viewSnap = await window.fbGet(totalRef);
          if (viewSnap.exists()) {
            document.getElementById('viewCountText').innerText = formatViews(viewSnap.val());
          }
        } catch (e) {
          console.error("Gagal update view:", e);
        }
      }

      checkFavoriteStatus();
      window.updateCommentAuthUI();
      loadComments();
    }

    async function checkFavoriteStatus() {
      const btn = document.getElementById('btnFavorite');
      if (!targetSlug || !btn) return;

      if (window.currentUser && window.db) {
        const favRef = window.fbRef(window.db, `users/${window.currentUser.uid}/favorites/${targetSlug}`);
        const snap = await window.fbGet(favRef);
        isFavorite = snap.exists();
      } else {
        let favs = JSON.parse(localStorage.getItem('rz_favorites') || '[]');
        isFavorite = favs.some(f => f.slug === targetSlug);
      }

      if (isFavorite) btn.classList.add('active');
      else btn.classList.remove('active');
    }

    async function toggleFavorite() {
      if (!targetSlug) return;
      isFavorite = !isFavorite;

      const btn = document.getElementById('btnFavorite');
      if (isFavorite) btn.classList.add('active');
      else btn.classList.remove('active');

      const favItem = {
        slug: targetSlug,
        title: currentMainTitle || 'Donghua',
        poster: currentPoster || '',
        timestamp: Date.now()
      };

      if (window.currentUser && window.db) {
        const favRef = window.fbRef(window.db, `users/${window.currentUser.uid}/favorites/${targetSlug}`);
        if (isFavorite) {
          await window.fbSet(favRef, favItem);
        } else {
          await window.fbRemove(favRef);
        }
      } else {
        let favs = JSON.parse(localStorage.getItem('rz_favorites') || '[]');
        if (isFavorite) {
          favs = favs.filter(f => f.slug !== targetSlug);
          favs.unshift(favItem);
        } else {
          favs = favs.filter(f => f.slug !== targetSlug);
        }
        localStorage.setItem('rz_favorites', JSON.stringify(favs));
      }
    }

    function triggerDownload() {
      if (!currentServerUrl) {
        alert("Video belum siap diunduh.");
        return;
      }

      const cleanFileName = (currentMainTitle || 'video').replace(/[^a-zA-Z0-9_-]/g, '_') + '.mp4';
      
      const a = document.createElement('a');
      a.href = currentServerUrl;
      a.download = cleanFileName;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function triggerShare() {
      const shareData = {
        title: currentMainTitle || 'RZSTREAM Donghua',
        text: `Tonton ${currentMainTitle || 'Donghua'} Sub Indo gratis di RZSTREAM!`,
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Tautan berhasil disalin ke clipboard!");
      }
    }

    window.updateCommentAuthUI = function() {
      const formBox = document.getElementById('commentFormBox');
      const noticeBox = document.getElementById('commentLoginNotice');

      if (window.currentUser) {
        if (formBox) formBox.style.display = 'flex';
        if (noticeBox) noticeBox.style.display = 'none';
      } else {
        if (formBox) formBox.style.display = 'none';
        if (noticeBox) noticeBox.style.display = 'block';
      }
    };

    async function loadComments() {
      const container = document.getElementById('commentsListContainer');
      if (!window.db || !targetSlug) {
        container.innerHTML = '<p style="font-size:12px; color:#64748b;">Komentar belum dapat dimuat.</p>';
        return;
      }

      try {
        const commentsRef = window.fbRef(window.db, `comments/${targetSlug}`);
        const snap = await window.fbGet(commentsRef);

        if (snap.exists()) {
          const commentsData = snap.val();
          container.innerHTML = '';

          const mainComments = [];
          const repliesMap = {};

          Object.keys(commentsData).forEach(key => {
            const item = { id: key, ...commentsData[key] };
            if (item.parentId) {
              if (!repliesMap[item.parentId]) repliesMap[item.parentId] = [];
              repliesMap[item.parentId].push(item);
            } else {
              mainComments.push(item);
            }
          });

          mainComments.reverse();

          if (mainComments.length === 0) {
            container.innerHTML = '<p style="font-size:12px; color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
            return;
          }

          mainComments.forEach(item => {
            const replies = repliesMap[item.id] || [];
            container.appendChild(renderTikTokCommentCard(item, replies));
          });
        } else {
          container.innerHTML = '<p style="font-size:12px; color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
        }
      } catch (e) {
        container.innerHTML = '<p style="font-size:12px; color:#ef4444;">Gagal memuat komentar.</p>';
      }
    }

    // Render Komentar & Balasan Bergaya TikTok
    function renderTikTokCommentCard(item, replies = []) {
      const card = document.createElement('div');
      card.className = 'comment-card';
      card.id = `comment-${item.id}`;

      const timeAgo = item.timestamp ? getTimeAgo(item.timestamp) : 'Baru saja';
      const authorEmail = (item.email || '').toLowerCase();
      const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase();

      let currentAuthorName = item.author || 'User';
      let currentPhotoURL = item.photoURL || '';

      if (window.currentUser && window.currentUser.uid === item.uid) {
        currentAuthorName = window.currentUser.displayName || currentAuthorName;
        currentPhotoURL = window.currentUser.photoURL || currentPhotoURL;
      }

      const initial = currentAuthorName.charAt(0).toUpperCase();
      const photoHtml = currentPhotoURL ? `<img src="${currentPhotoURL}" />` : initial;
      const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
      const isMyComment = window.currentUser && (window.currentUser.uid === item.uid);

      let actionButtons = '';
      if (window.currentUser) {
        actionButtons += `<button class="btn-reply-tiktok" onclick="toggleReplyBox('${item.id}')">Balas</button>`;
        if (isMyComment || (window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase())) {
          actionButtons += `<button class="btn-delete-tiktok" onclick="deleteComment('${item.id}')">Hapus</button>`;
        }
      }

      // Render Balasan (jika ada)
      let repliesHtml = '';
      if (replies.length > 0) {
        repliesHtml = `
          <button class="replies-toggle-btn" id="btn-toggle-${item.id}" onclick="toggleRepliesDisplay('${item.id}', ${replies.length})">
            Lihat ${replies.length} balasan ▾
          </button>
          <div class="replies-container" id="replies-box-${item.id}">
            ${replies.map(reply => renderTikTokReplyCardHtml(reply)).join('')}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="tiktok-avatar">${photoHtml}</div>
        <div class="comment-content">
          <div class="comment-user-row">
            <span class="tiktok-username ${isAdmin ? 'admin' : ''}">${escapeHtml(currentAuthorName)}</span>
            ${adminBadge}
          </div>
          <div class="comment-body-text">${escapeHtml(item.text)}</div>
          <div class="comment-footer-actions">
            <span class="comment-time">${timeAgo}</span>
            ${actionButtons}
          </div>
          <div id="reply-input-wrapper-${item.id}"></div>
          ${repliesHtml}
        </div>
        <div class="comment-like-box" onclick="toggleLikeComment(this)">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
      `;

      return card;
    }

    function renderTikTokReplyCardHtml(reply) {
      const timeAgo = reply.timestamp ? getTimeAgo(reply.timestamp) : 'Baru saja';
      const authorEmail = (reply.email || '').toLowerCase();
      const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase();

      let currentAuthorName = reply.author || 'User';
      let currentPhotoURL = reply.photoURL || '';

      if (window.currentUser && window.currentUser.uid === reply.uid) {
        currentAuthorName = window.currentUser.displayName || currentAuthorName;
        currentPhotoURL = window.currentUser.photoURL || currentPhotoURL;
      }

      const initial = currentAuthorName.charAt(0).toUpperCase();
      const photoHtml = currentPhotoURL ? `<img src="${currentPhotoURL}" />` : initial;
      const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
      const isMyComment = window.currentUser && (window.currentUser.uid === reply.uid);

      let deleteBtn = '';
      if (window.currentUser && (isMyComment || (window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()))) {
        deleteBtn = `<button class="btn-delete-tiktok" onclick="deleteComment('${reply.id}')">Hapus</button>`;
      }

      return `
        <div class="reply-card" id="comment-${reply.id}">
          <div class="tiktok-avatar">${photoHtml}</div>
          <div class="comment-content">
            <div class="comment-user-row">
              <span class="tiktok-username ${isAdmin ? 'admin' : ''}">${escapeHtml(currentAuthorName)}</span>
              ${adminBadge}
            </div>
            <div class="comment-body-text">${escapeHtml(reply.text)}</div>
            <div class="comment-footer-actions">
              <span class="comment-time">${timeAgo}</span>
              ${deleteBtn}
            </div>
          </div>
        </div>
      `;
    }

    // Toggle Sembunyi/Tampil Balasan TikTok
    function toggleRepliesDisplay(commentId, count) {
      const container = document.getElementById(`replies-box-${commentId}`);
      const btn = document.getElementById(`btn-toggle-${commentId}`);
      if (!container || !btn) return;

      if (container.classList.contains('show')) {
        container.classList.remove('show');
        btn.innerText = `Lihat ${count} balasan ▾`;
      } else {
        container.classList.add('show');
        btn.innerText = `Sembunyikan balasan ▴`;
      }
    }

    function toggleLikeComment(el) {
      el.classList.toggle('liked');
    }

    function toggleReplyBox(commentId) {
      const container = document.getElementById(`reply-input-wrapper-${commentId}`);
      if (!container) return;

      if (container.innerHTML !== '') {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = `
        <div class="reply-input-box">
          <input type="text" class="reply-input" id="replyInput-${commentId}" placeholder="Tulis balasan..." />
          <button class="btn-reply-send" onclick="submitReply('${commentId}')">Kirim</button>
        </div>
      `;
    }

    async function submitComment() {
      if (!window.currentUser) {
        alert("Anda harus login terlebih dahulu.");
        return;
      }

      const input = document.getElementById('commentInput');
      const text = input.value.trim();

      if (!text) return;

      const name = window.currentUser.displayName || (window.currentUser.email ? window.currentUser.email.split('@')[0] : 'User');

      const commentItem = {
        uid: window.currentUser.uid,
        email: window.currentUser.email || '',
        author: name,
        photoURL: window.currentUser.photoURL || '',
        text: text,
        timestamp: Date.now()
      };

      try {
        const newCommentRef = window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`);
        await window.fbSet(newCommentRef, commentItem);
        input.value = '';
        loadComments();
      } catch (e) {
        alert("Gagal mengirim komentar: " + e.message);
      }
    }

    async function submitReply(parentId) {
      if (!window.currentUser) return;

      const input = document.getElementById(`replyInput-${parentId}`);
      const text = input ? input.value.trim() : '';

      if (!text) return;

      const name = window.currentUser.displayName || (window.currentUser.email ? window.currentUser.email.split('@')[0] : 'User');

      const replyItem = {
        uid: window.currentUser.uid,
        email: window.currentUser.email || '',
        author: name,
        photoURL: window.currentUser.photoURL || '',
        text: text,
        parentId: parentId,
        timestamp: Date.now()
      };

      try {
        const newCommentRef = window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`);
        await window.fbSet(newCommentRef, replyItem);
        loadComments();
      } catch (e) {
        alert("Gagal membalas komentar: " + e.message);
      }
    }

    async function deleteComment(commentId) {
      if (!confirm("Apakah Anda yakin ingin menghapus komentar ini?")) return;

      try {
        const commentRef = window.fbRef(window.db, `comments/${targetSlug}/${commentId}`);
        await window.fbRemove(commentRef);
        loadComments();
      } catch (e) {
        alert("Gagal menghapus komentar: " + e.message);
      }
    }

    function getTimeAgo(timestamp) {
      const seconds = Math.floor((Date.now() - timestamp) / 1000);
      if (seconds < 60) return 'Baru saja';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}j`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days}d`;
      return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadDetail() {
      if (!targetSlug) {
        document.getElementById('mediaDetailsGroup').innerHTML = '<h1 class="media-title">Slug Tidak Ditemukan</h1>';
        return;
      }

      let res = await fetch(`/api/detail?slug=${encodeURIComponent(targetSlug)}`).then(r => r.json()).catch(() => null);
      if (!res || !res.success) {
        res = await fetch(`/api/movie?slug=${encodeURIComponent(targetSlug)}`).then(r => r.json()).catch(() => null);
      }

      if (res && res.success && res.data) {
        const data = res.data;
        currentMainTitle = data.title;
        currentPoster = data.poster || '';
        document.getElementById('topHeaderTitle').innerText = data.title;
        document.getElementById('pageTitle').innerText = `${data.title} - RZ Media Player`;

        document.getElementById('mediaDetailsGroup').innerHTML = `
          <h1 class="media-title">${data.title}</h1>
          <p class="synopsis-text">${data.synopsis || 'Tidak ada deskripsi.'}</p>
        `;

        if (data.isMovie) {
          document.getElementById('epContainer').style.display = 'none';
          setupServers(data.servers);
          saveHistory(targetSlug, targetSlug, data.title, data.poster, 'Movie');
        } else {
          document.getElementById('epContainer').style.display = 'block';
          globalEpisodes = data.episodes || [];
          document.getElementById('epTotalInfo').innerText = `${globalEpisodes.length} Episode`;

          const epGrid = document.getElementById('epGrid');
          epGrid.innerHTML = '';

          globalEpisodes.forEach((ep, i) => {
            const epNum = getEpNumber(ep.title, i + 1);
            const box = document.createElement('div');
            box.className = 'ep-box';
            box.innerText = epNum;
            box.id = `ep-box-${cleanSlug(ep.slug)}`;
            box.onclick = () => selectEpisode(ep.slug, data.title, data.poster, `Ep ${epNum}`);
            epGrid.appendChild(box);
          });

          if (globalEpisodes.length > 0) {
            const firstNum = getEpNumber(globalEpisodes[0].title, 1);
            selectEpisode(globalEpisodes[0].slug, data.title, data.poster, `Ep ${firstNum}`);
          }
        }
      } else {
        document.getElementById('mediaDetailsGroup').innerHTML = '<h1 class="media-title">Gagal Memuat Detail</h1>';
        document.getElementById('playerMediaContainer').innerText = 'Media tidak ditemukan.';
      }

      showServerHint();
      initViewsAndComments();
    }

    async function selectEpisode(epSlug, title, poster, episodeName) {
      closeEpisodeSheet();
      const cleanEp = cleanSlug(epSlug);
      
      document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
      const activeBox = document.getElementById(`ep-box-${cleanEp}`);
      if (activeBox) activeBox.classList.add('active');

      saveHistory(targetSlug, cleanEp, title, poster, episodeName);
      
      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = '<div class="skeleton skeleton-player"></div>';
      
      const res = await fetch(`/api/detail?slug=${encodeURIComponent(cleanEp)}`).then(r => r.json()).catch(() => null);
      if (res && res.success && res.data && res.data.servers && res.data.servers.length > 0) {
        setupServers(res.data.servers);
      } else {
        mediaBox.innerHTML = 'Server video episode ini belum tersedia.';
      }
    }

    function setupServers(servers) {
      const serverSelect = document.getElementById('serverSelect');
      serverSelect.innerHTML = '';

      if (servers && servers.length > 0) {
        let defaultIndex = servers.findIndex(s => /indo|sub indo/i.test(s.name));
        if (defaultIndex === -1) defaultIndex = 0;

        servers.forEach((srv, index) => {
          const opt = document.createElement('option');
          opt.value = srv.url;
          opt.innerText = srv.name;
          if (index === defaultIndex) opt.selected = true;
          serverSelect.appendChild(opt);
        });

        serverSelect.selectedIndex = defaultIndex;
        currentServerUrl = servers[defaultIndex].url;
        renderPlayerMedia(servers[defaultIndex].url);
      } else {
        document.getElementById('playerMediaContainer').innerText = 'Server video tidak tersedia.';
      }
    }

    function switchServer(url) {
      if (url) {
        currentServerUrl = url;
        renderPlayerMedia(url);
      }
    }

    function renderPlayerMedia(url) {
      const mediaBox = document.getElementById('playerMediaContainer');
      if (!url) return;
      mediaBox.innerHTML = `<iframe class="player-iframe" src="${url}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
    }

    function openEpisodeSheet() {
      const sheetGrid = document.getElementById('sheetEpGrid');
      const overlay = document.getElementById('sheetOverlay');
      sheetGrid.innerHTML = '';

      if (globalEpisodes.length === 0) return;

      globalEpisodes.forEach((ep, i) => {
        const epNum = getEpNumber(ep.title, i + 1);
        const box = document.createElement('div');
        box.className = 'ep-box';
        box.innerText = epNum;
        box.onclick = () => selectEpisode(ep.slug, currentMainTitle, '', `Ep ${epNum}`);
        sheetGrid.appendChild(box);
      });

      overlay.classList.add('active');
    }

    function closeEpisodeSheet() {
      document.getElementById('sheetOverlay').classList.remove('active');
    }

    function saveHistory(mainPath, epPath, title, poster, episode) {
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      history = history.filter(item => item.mainPath !== mainPath);
      history.unshift({ mainPath, epPath, title, poster, episode });
      localStorage.setItem('rz_continue_history', JSON.stringify(history.slice(0, 10)));
    }

    window.onload = loadDetail;
  </script>
</body>
