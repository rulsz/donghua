<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZ Media Player - Detail</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: #000000; 
      color: #f8fafc; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-top: 68px; 
      padding-bottom: 30px; 
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 70%, rgba(0, 0, 0, 0) 100%); 
      padding: 10px 16px 16px 16px; 
    }
    .header-content { 
      max-width: 1000px; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; height: 44px; 
    }
    
    .header-left-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }

    .icon-circle-btn { 
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px);
      color: #ffffff; 
      border-radius: 50%; 
      width: 44px; height: 44px; 
      cursor: pointer; 
      display: flex; align-items: center; justify-content: center; 
      border: 1px solid rgba(255, 255, 255, 0.15);
      -webkit-tap-highlight-color: transparent;
    }

    .icon-circle-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .brand-title { font-size: 17px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }

    .player-wrapper { margin-left: -16px; margin-right: -16px; width: calc(100% + 32px); background: #000; margin-bottom: 16px; }
    .detail-player-box { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
    .player-iframe { width: 100%; height: 100%; border: none; }

    .ep-scroll-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 16px; scrollbar-width: none; }
    .ep-scroll-grid::-webkit-scrollbar { display: none; }
    .ep-box { flex: 0 0 54px; height: 54px; background: #111827; border: 1px solid #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; }
    .ep-box.active { background: #581c87; border-color: #a855f7; color: #fff; }

    .action-bar { display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 11px; cursor: pointer; }
    .action-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    .media-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .synopsis-text { font-size: 13px; line-height: 1.5; color: #94a3b8; margin-bottom: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-left-group" onclick="goBack()">
        <button class="icon-circle-btn">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="brand-title" id="topHeaderTitle">Detail Video</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="player-wrapper">
      <div class="detail-player-box" id="playerMediaContainer">Memuat player...</div>
    </div>

    <div class="detail-body">
      <div id="epContainer">
        <div class="ep-scroll-grid" id="epGrid"></div>
      </div>

      <div class="action-bar">
        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Favorit</span>
        </div>
        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Unduh</span>
        </div>
        <div class="action-item">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Bagikan</span>
        </div>
      </div>

      <h1 class="media-title" id="dTitle">Memuat Judul...</h1>
      <p class="synopsis-text" id="dSynopsis">Memuat deskripsi...</p>
    </div>
  </div>

  <script>
    // Ambil slug dari query parameter Vercel Rewrite atau URL Path
    const urlParams = new URLSearchParams(window.location.search);
    let targetSlug = urlParams.get('slug');

    if (!targetSlug) {
      targetSlug = window.location.pathname.replace(/^\/detail\//, '').replace(/\/$/, '');
    }

    function goBack() {
      window.location.href = '/';
    }

    async function loadDetail() {
      if (!targetSlug) {
        document.getElementById('dTitle').innerText = 'Judul tidak ditemukan';
        return;
      }

      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = 'Memuat player...';

      let res = await fetch(`/api/detail?slug=${encodeURIComponent(targetSlug)}`).then(r => r.json()).catch(() => null);
      if (!res || !res.success) {
        res = await fetch(`/api/movie?slug=${encodeURIComponent(targetSlug)}`).then(r => r.json()).catch(() => null);
      }

      if (res && res.success && res.data) {
        const data = res.data;
        document.getElementById('dTitle').innerText = data.title;
        document.getElementById('topHeaderTitle').innerText = data.title;
        document.getElementById('dSynopsis').innerText = data.synopsis || 'Tidak ada deskripsi.';

        if (data.isMovie) {
          document.getElementById('epContainer').style.display = 'none';
          if (data.servers && data.servers.length > 0) {
            mediaBox.innerHTML = `<iframe class="player-iframe" src="${data.servers[0].url}" allowfullscreen></iframe>`;
            saveHistory(targetSlug, targetSlug, data.title, data.poster, 'Movie');
          } else {
            mediaBox.innerHTML = 'Video film belum tersedia.';
          }
        } else {
          document.getElementById('epContainer').style.display = 'block';
          const epGrid = document.getElementById('epGrid');
          epGrid.innerHTML = '';

          (data.episodes || []).forEach((ep, i) => {
            const box = document.createElement('div');
            box.className = 'ep-box';
            box.innerText = i + 1;
            box.onclick = () => {
              document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
              box.classList.add('active');
              saveHistory(targetSlug, ep.slug, data.title, data.poster, `Ep ${i + 1}`);
              fetchAndPlayStream(ep.slug);
            };
            epGrid.appendChild(box);
          });

          if (data.episodes && data.episodes.length > 0) {
            epGrid.children[0].classList.add('active');
            saveHistory(targetSlug, data.episodes[0].slug, data.title, data.poster, 'Ep 1');
            fetchAndPlayStream(data.episodes[0].slug);
          }
        }
      } else {
        document.getElementById('dTitle').innerText = 'Gagal Memuat Detail';
        mediaBox.innerHTML = 'Media tidak ditemukan.';
      }
    }

    async function fetchAndPlayStream(epSlug) {
      const mediaBox = document.getElementById('playerMediaContainer');
      mediaBox.innerHTML = 'Memuat video...';
      const res = await fetch(`/api/detail?slug=${encodeURIComponent(epSlug)}`).then(r => r.json()).catch(() => null);

      if (res && res.success && res.data && res.data.servers && res.data.servers.length > 0) {
        mediaBox.innerHTML = `<iframe class="player-iframe" src="${res.data.servers[0].url}" allowfullscreen></iframe>`;
      } else {
        mediaBox.innerHTML = 'Server video episode ini belum tersedia.';
      }
    }

    function saveHistory(mainPath, epPath, title, poster, episode) {
      let history = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      history = history.filter(item => item.mainPath !== mainPath);
      history.unshift({ mainPath, epPath, title, poster, episode });
      localStorage.setItem('rz_continue_history', JSON.stringify(history.slice(0, 10)));
    }

    window.onload = loadDetail;
  </script>
</body>
</html>
