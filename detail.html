<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detail Player - RZ Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-top: 60px; padding-bottom: 30px; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #0f172a; border-bottom: 1px solid #1e293b; height: 50px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
    .back-btn { background: none; border: none; color: #38bdf8; font-size: 20px; font-weight: bold; cursor: pointer; }
    .header-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
    .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 16px; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
    .player-iframe { width: 100%; height: 100%; border: none; }
    .media-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: #38bdf8; }
    .synopsis-text { font-size: 13px; line-height: 1.5; color: #94a3b8; margin-bottom: 20px; }
    .ep-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; margin-bottom: 20px; }
    .ep-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; text-align: center; font-size: 13px; font-weight: 700; cursor: pointer; color: #f8fafc; }
    .ep-box.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="window.location.href='/'">➔</button>
    <div class="header-title" id="topTitle">Memuat...</div>
  </header>

  <div class="container">
    <div class="player-wrapper" id="playerContainer">Memuat player...</div>

    <h1 class="media-title" id="dTitle">Memuat...</h1>
    <p class="synopsis-text" id="dSynopsis">Memuat deskripsi...</p>

    <div class="ep-title">Daftar Episode</div>
    <div class="ep-grid" id="epGrid"></div>
  </div>

  <script>
    function getSlug() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('slug') || '';
    }

    async function loadDetail() {
      const slug = getSlug();
      if (!slug) return;

      const res = await fetch(`/api/detail?slug=${encodeURIComponent(slug)}`).then(r => r.json()).catch(() => null);

      if (res && res.success && res.data) {
        const data = res.data;
        document.getElementById('dTitle').innerText = data.title;
        document.getElementById('topTitle').innerText = data.title;
        document.getElementById('dSynopsis').innerText = data.synopsis;

        if (data.servers && data.servers.length > 0) {
          document.getElementById('playerContainer').innerHTML = `<iframe class="player-iframe" src="${data.servers[0].url}" allowfullscreen></iframe>`;
        } else {
          document.getElementById('playerContainer').innerText = 'Video tidak tersedia.';
        }

        const epGrid = document.getElementById('epGrid');
        epGrid.innerHTML = '';

        if (data.episodes && data.episodes.length > 0) {
          data.episodes.forEach((ep, i) => {
            const box = document.createElement('div');
            box.className = 'ep-box';
            box.innerText = i + 1;
            box.onclick = () => loadEpisode(ep.slug);
            epGrid.appendChild(box);
          });
        } else {
          epGrid.innerText = 'Episode belum tersedia.';
        }
      }
    }

    async function loadEpisode(epSlug) {
      document.getElementById('playerContainer').innerText = 'Memuat episode...';
      const res = await fetch(`/api/detail?slug=${encodeURIComponent(epSlug)}`).then(r => r.json()).catch(() => null);
      if (res && res.success && res.data && res.data.servers && res.data.servers.length > 0) {
        document.getElementById('playerContainer').innerHTML = `<iframe class="player-iframe" src="${res.data.servers[0].url}" allowfullscreen></iframe>`;
      }
    }

    window.onload = loadDetail;
  </script>
</body>
</html>
